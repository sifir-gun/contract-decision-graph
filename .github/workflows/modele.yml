# Image du modèle d'embedding (ADR 005, PR B) : les poids, figés par leurs empreintes, dans
# une image sans système ni outil, montée en lecture seule dans les pods. Seule exception à
# « aucun téléchargement du modèle en CI » (plan validé) : ce workflow télécharge les poids
# depuis Hugging Face (2,2 Go), les vérifie, puis construit et teste l'image.
# - pull request qui touche l'image du modèle ou le chargement des poids : vérification,
#   sans aucun droit d'écriture, rien de publié ;
# - à la demande, depuis main : la même vérification, puis publication sur ghcr.io,
#   signature sans clé et attestation de provenance.
name: Modèle d'embedding

on:
  workflow_dispatch:
  pull_request:
    # ce qui décide du chargement des poids : l'image du modèle, l'adaptateur, l'image de
    # l'application et ses dépendances, la configuration du modèle, et le test lui-même
    paths:
      - docker/modele/**
      - scripts/modele.py
      - src/cdg/adapters/fastembed.py
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - config/decision.yaml
      - tests/test_modele.py
      - tests/test_licences.py
      - .github/workflows/modele.yml

permissions:
  contents: read

jobs:
  verification:
    name: vérification (poids, empreintes, image, chargement sans réseau)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Espace disque (poids, image, extraction pour le test)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Dépendances, strictement depuis uv.lock
        run: uv sync --locked
      - name: Téléchargement des poids depuis Hugging Face (2,2 Go)
        env:
          EMBEDDING_CACHE_DIR: ${{ runner.temp }}/modele
        run: uv run --no-sync python -m cdg.cli fetch-embedding-model
      - name: Poids conformes à leurs empreintes (docker/modele/empreintes.sha256)
        run: uv run --no-sync python scripts/modele.py verifier "$RUNNER_TEMP/modele"
      - name: Image du modèle, depuis le cache vérifié
        run: >-
          docker build --file docker/modele/Dockerfile --build-context notice=docker/modele
          --tag cdg-modele:verification "$RUNNER_TEMP/modele"
      - name: Image de l'application, qui charge les poids
        run: docker build --tag cdg:verification .
      - name: Poids chargés par l'application, en lecture seule et sans réseau
        run: >-
          uv run --no-sync pytest -m modele --image cdg:verification
          --modele cdg-modele:verification
      - name: Variante arm64 de l'image du modèle, au contenu identique
        # FROM scratch, aucune commande exécutée : pas d'émulation ; les couches (contenu
        # décompressé) doivent être exactement celles de la variante amd64 testée
        run: |
          docker build --platform linux/arm64 --file docker/modele/Dockerfile \
            --build-context notice=docker/modele --tag cdg-modele:verification-arm64 \
            "$RUNNER_TEMP/modele"
          amd64="$(docker image inspect cdg-modele:verification --format '{{json .RootFS.Layers}}')"
          arm64="$(docker image inspect cdg-modele:verification-arm64 \
            --format '{{json .RootFS.Layers}}')"
          if [ "$amd64" != "$arm64" ]; then
            echo "couches différentes entre amd64 et arm64" >&2
            exit 1
          fi

  publication:
    name: publication (ghcr.io, signature, attestation)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # pousser l'image sur ghcr.io
      id-token: write # identité OIDC du workflow : signature sans clé, attestation
      attestations: write # attestation de provenance
    env:
      IMAGE: ghcr.io/${{ github.repository }}/modele-embedding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Espace disque (poids, image, extraction pour le test)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Dépendances, strictement depuis uv.lock
        run: uv sync --locked
      - name: Téléchargement des poids depuis Hugging Face (2,2 Go)
        env:
          EMBEDDING_CACHE_DIR: ${{ runner.temp }}/modele
        run: uv run --no-sync python -m cdg.cli fetch-embedding-model
      - name: Poids conformes à leurs empreintes (docker/modele/empreintes.sha256)
        run: uv run --no-sync python scripts/modele.py verifier "$RUNNER_TEMP/modele"
      - name: Image du modèle, depuis le cache vérifié
        run: >-
          docker build --file docker/modele/Dockerfile --build-context notice=docker/modele
          --tag cdg-modele:verification "$RUNNER_TEMP/modele"
      - name: Image de l'application, qui charge les poids
        run: docker build --tag cdg:verification .
      - name: Poids chargés par l'application, en lecture seule et sans réseau
        run: >-
          uv run --no-sync pytest -m modele --image cdg:verification
          --modele cdg-modele:verification
      - name: Variante arm64 de l'image du modèle, au contenu identique
        # FROM scratch, aucune commande exécutée : pas d'émulation ; les couches (contenu
        # décompressé) doivent être exactement celles de la variante amd64 testée
        run: |
          docker build --platform linux/arm64 --file docker/modele/Dockerfile \
            --build-context notice=docker/modele --tag cdg-modele:verification-arm64 \
            "$RUNNER_TEMP/modele"
          amd64="$(docker image inspect cdg-modele:verification --format '{{json .RootFS.Layers}}')"
          arm64="$(docker image inspect cdg-modele:verification-arm64 \
            --format '{{json .RootFS.Layers}}')"
          if [ "$amd64" != "$arm64" ]; then
            echo "couches différentes entre amd64 et arm64" >&2
            exit 1
          fi
      - name: Connexion à ghcr.io (jeton du workflow ; droit packages limité à ce job)
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publication de chaque architecture, empreinte relue dans le registre
        run: |
          docker tag cdg-modele:verification "$IMAGE:sha-$GITHUB_SHA-amd64"
          docker tag cdg-modele:verification-arm64 "$IMAGE:sha-$GITHUB_SHA-arm64"
          for arch in amd64 arm64; do
            docker push "$IMAGE:sha-$GITHUB_SHA-$arch"
            digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA-$arch" \
              --format '{{json .Manifest}}' | jq -r .digest)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "empreinte publiée illisible ($arch) : $digest" >&2
              exit 1
            fi
            echo "DIGEST_$(tr '[:lower:]' '[:upper:]' <<< "$arch")=$digest" >> "$GITHUB_ENV"
          done
      - name: Index amd64 et arm64, étiqueté par le commit
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE@$DIGEST_AMD64" "$IMAGE@$DIGEST_ARM64"
          manifest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" \
            --format '{{json .Manifest}}')"
          digest="$(jq -r .digest <<< "$manifest")"
          platforms="$(jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"]
            | sort | join(",")' <<< "$manifest")"
          test "$platforms" = "linux/amd64,linux/arm64" || {
            echo "plateformes de l'index inattendues : $platforms" >&2
            exit 1
          }
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "empreinte de l'index illisible : $digest" >&2
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3 # celui des vérifications (scripts/chaine.py)
      - name: Signature sans clé de l'index et de chaque image qu'il désigne
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"
      - name: Attestation de provenance (SLSA), sur l'index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          create-storage-record: false # dépôts d'organisation seulement
      - name: Vérification de ce qui est publié (signature, provenance)
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/modele.yml@refs/heads/main
          WORKFLOW: ${{ github.repository }}/.github/workflows/modele.yml
        run: |
          for digest in "$DIGEST" "$DIGEST_AMD64" "$DIGEST_ARM64"; do
            cosign verify "$IMAGE@$digest" --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
          gh attestation verify "oci://$IMAGE@$DIGEST" --owner "$GITHUB_REPOSITORY_OWNER" \
            --signer-workflow "$WORKFLOW"
      - name: Empreintes publiées ; le chart référence celle de l'index
        run: |
          {
            echo "### Image du modèle publiée"
            echo
            echo "- index : \`$IMAGE@$DIGEST\`"
            echo "- amd64 : \`$IMAGE@$DIGEST_AMD64\`"
            echo "- arm64 : \`$IMAGE@$DIGEST_ARM64\`"
            echo
            echo "Poids conformes à docker/modele/empreintes.sha256 ; signée, provenance attestée."
          } >> "$GITHUB_STEP_SUMMARY"
