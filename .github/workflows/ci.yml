# Intégration continue : lint, puis toute la suite de tests, tests pg compris, sur une base
# PostgreSQL + pgvector jetable. Les tests llm (vrai modèle, payants) restent exclus : aucun
# secret, aucun appel à un fournisseur LLM, aucun téléchargement du modèle d'embedding.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # audit hebdomadaire de main (dépendances Python, échéances du corpus, image : signatures
  # des bases, scan, exceptions expirées) : une faille publiée entre deux commits est vue
  # sans attendre le suivant ; lint, types et tests ne tournent pas sur ce déclenchement
  schedule:
    - cron: "17 7 * * 1" # lundi 7 h 17, après Dependabot, hors du début d'heure chargé
      timezone: "Europe/Paris"

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19" # celle du poste de développement ; uv.lock vérifié avec elle
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances de développement, strictement depuis uv.lock
        run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ruff check

  types:
    name: types (mypy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances, strictement depuis uv.lock (mypy lit les types des bibliothèques)
        run: uv sync --locked
      - name: mypy, strict sur domain/, ports/ et application/ (configuration dans pyproject.toml)
        run: uv run --no-sync mypy

  audit:
    name: audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: pip-audit, strictement depuis uv.lock (groupe audit)
        run: uv sync --locked --only-group audit
      - name: Dépendances de uv.lock, tous groupes, figées avec leurs empreintes
        # pip-audit 2.10 ne lit pas uv.lock : export au format requirements, sans le projet
        run: >-
          uv export --locked --all-groups --no-emit-project --format requirements-txt
          --output-file "$RUNNER_TEMP/requirements-audit.txt"
      - name: Audit, échec sur toute faille connue (code de sortie 1)
        # --require-hashes et --disable-pip : aucune résolution, les versions de uv.lock
        # telles quelles ; --strict : un paquet introuvable fait aussi échouer l'audit
        run: >-
          uv run --no-sync pip-audit --require-hashes --disable-pip --strict
          --requirement "$RUNNER_TEMP/requirements-audit.txt"
      - name: Projet, sans le groupe dev, pour le contrôle des échéances du corpus
        run: uv sync --locked --no-dev
      - name: Échéances du corpus, échec si une source expire dans les 60 jours
        # aussi chaque lundi : le déclenchement planifié ne lance que ce job
        run: uv run --no-sync python scripts/echeances_corpus.py --jours 60

  tests:
    name: tests (PostgreSQL + pgvector)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 16.11 + pgvector 0.8.1 : même image et même empreinte que docker-compose.yml
        image: pgvector/pgvector:pg16@sha256:0a07c4114ba6d1d04effcce3385e9f5ce305eb02e56a3d35948a415a52f193ec
        env:
          POSTGRES_USER: cdg_admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: cdg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cdg_admin -d cdg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # base jetable, détruite avec le job : ces mots de passe ne protègent rien, ce ne sont
      # pas des secrets
      POSTGRES_USER: cdg_admin
      POSTGRES_PASSWORD: ci-admin
      POSTGRES_DB: cdg
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      APP_DB_PASSWORD: ci-app
      LANGSMITH_TRACING: "false"
      # garde-fou : un téléchargement Hugging Face échouerait au lieu de tirer 2,2 Go
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances, strictement depuis uv.lock
        run: uv sync --locked
      - name: Migrations, par le script d'init du dépôt exécuté dans le conteneur
        # un conteneur de service démarre avant le checkout : il ne peut pas monter
        # docker/initdb comme le fait docker-compose.yml
        run: |
          docker cp migrations "${{ job.services.postgres.id }}:/migrations"
          docker exec -i -e APP_DB_PASSWORD "${{ job.services.postgres.id }}" \
            bash -s < docker/initdb/00_migrate.sh
      - name: setup-db (tables du checkpointer, droits d'app_role)
        run: uv run --no-sync python -m cdg.cli setup-db
      - name: Tests, tests pg compris (tests llm exclus par défaut), couverture et seuil
        # seuil : fail_under de [tool.coverage.report], lu par pytest-cov
        run: uv run --no-sync pytest --cov --cov-report=term

  chart:
    name: chart (lint, schémas, bonnes pratiques, rendu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances, strictement depuis uv.lock (pytest pour les tests du rendu)
        run: uv sync --locked
      - name: helm 4.3.0, archive officielle vérifiée par son empreinte
        # sur le poste : Homebrew, même version (scripts/chart.py la contrôle)
        id: installation-helm
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - name: Validation statique (helm lint, kubeconform, kube-linter) des trois variantes
        run: uv run --no-sync python scripts/chart.py verifier --dossier "$RUNNER_TEMP/chart"
      - name: Garanties du chart rendu (sécurité, empreintes, réseau, tâches, arrêt propre)
        run: uv run --no-sync pytest -m chart --chart

  image:
    name: image (construction et vérifications, ${{ matrix.arch }})
    # aussi chaque lundi : une faille publiée entre deux commits, une exception expirée.
    # Une construction native par architecture, sur son propre runner : ni émulation, ni
    # plateforme forcée ; chaque image passe la même chaîne de vérification
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm # runner ARM de GitHub, dépôts publics
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances, strictement depuis uv.lock (pytest et httpx pour les vérifications)
        run: uv sync --locked
      - name: Signatures des images de base, avant la construction
        # distroless : signature cosign sans clé du projet ; uv : attestation de provenance
        # de GitHub (astral-sh/uv) ; toute base sans politique de vérification est refusée
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/chaine.py bases
      - name: Construction, bases figées par empreinte, dépendances strictement depuis uv.lock
        # l'image n'est ni publiée ni signée ici : c'est l'objet de la PR B (ADR 005)
        run: docker build --tag cdg:verification .
      - name: Vérifications de l'image construite (non root, lecture seule, sans shell)
        run: uv run --no-sync pytest -m image --image cdg:verification
      - name: Inventaire des composants (Syft), en SPDX et au format de Syft
        run: >-
          uv run --no-sync python scripts/chaine.py inventaire cdg:verification
          --dossier "$RUNNER_TEMP/chaine"
      - name: Scan (Grype), échec sur une faille critique ou haute corrigeable
        # exceptions justifiées, datées et expirantes : securite/exceptions-vulnerabilites.yaml
        run: uv run --no-sync python scripts/chaine.py scan --dossier "$RUNNER_TEMP/chaine"
      - name: Image et inventaire, pour le cluster de test et la publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/chaine/image.tar
            ${{ runner.temp }}/chaine/sbom.spdx.json
          if-no-files-found: error
          retention-days: 1
      # proxy de sortie (PR C3) : Smokescreen construit par nous, même chaîne
      - name: Proxy de sortie, signatures des images de base
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/chaine.py bases --dockerfile docker/proxy-sortie/Dockerfile
      - name: Proxy de sortie, construction (Go et source figés par empreinte et commit)
        run: docker build --file docker/proxy-sortie/Dockerfile --tag cdg-proxy:verification docker/proxy-sortie
      - name: Proxy de sortie, vérifications (non root, licences, filtrage réel)
        run: uv run --no-sync pytest -m proxy --proxy cdg-proxy:verification --image cdg:verification
      - name: Proxy de sortie, inventaire des composants (Syft)
        run: >-
          uv run --no-sync python scripts/chaine.py inventaire cdg-proxy:verification
          --dossier "$RUNNER_TEMP/chaine-proxy"
      - name: Proxy de sortie, scan (Grype)
        run: uv run --no-sync python scripts/chaine.py scan --dossier "$RUNNER_TEMP/chaine-proxy"
      - name: Proxy de sortie, image et inventaire, pour le cluster et la publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/chaine-proxy/image.tar
            ${{ runner.temp }}/chaine-proxy/sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  cluster:
    name: cluster (k3d, scénarios)
    # un vrai cluster de plusieurs nœuds à chaque pull request (ADR 005, PR C3) : les
    # images testées par le job image, CloudNativePG et ses sauvegardes, le proxy de sortie,
    # le serveur factice de Mistral ; profil ci (CI=true, scripts/cluster.py)
    if: github.event_name != 'schedule'
    needs: [image]
    runs-on: ubuntu-24.04
    # ingestion du corpus (60 min au plus, tâche Helm) et scénarios
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances, strictement depuis uv.lock (pytest et httpx pour les scénarios)
        run: uv sync --locked
      - name: k3d 5.9.0, binaire officiel vérifié par son empreinte
        # sur le poste : Homebrew, même version (scripts/cluster.py la contrôle)
        id: installation-k3d
        run: |
          curl -fsSLo "$RUNNER_TEMP/k3d" https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  $RUNNER_TEMP/k3d" \
            | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
      - name: kubectl 1.36.4, binaire officiel vérifié par son empreinte
        id: installation-kubectl
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          echo "8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a  $RUNNER_TEMP/kubectl" \
            | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
      - name: helm 4.3.0, archive officielle vérifiée par son empreinte
        id: installation-helm
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-amd64
          path: ${{ runner.temp }}/chaine
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proxy-amd64
          path: ${{ runner.temp }}/chaine-proxy
      - name: Images testées par le job image, jamais reconstruites
        run: |
          docker load --input "$RUNNER_TEMP/chaine/image.tar"
          docker load --input "$RUNNER_TEMP/chaine-proxy/image.tar"
      - name: Image de test du serveur factice, sur l'image de l'application
        run: docker build --file docker/mistral-factice/Dockerfile --build-arg APPLICATION=cdg:verification --tag cdg-mistral-factice:verification .
      - name: Espace disque (14 Go garantis) ; outils préinstallés inutilisés retirés sous 30 Go libres
        id: installation-espace-disque
        env:
          # besoin du cluster au pire, 28,4 Go, calculé sur la taille des images
          # (scripts/cluster.py, disk_need_gb ; ADR 005)
          ESPACE_MIN_GO: "30"
        run: |
          df -h /
          libre=$(df --output=avail --block-size=1G / | tail -n 1 | tr -d " ")
          if (( libre < ESPACE_MIN_GO )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
            df -h /
          else
            echo "espace suffisant : ${libre} Go libres, ${ESPACE_MIN_GO} exigés ; aucun nettoyage"
          fi
      - name: Aucun cluster d'un essai précédent
        run: uv run --no-sync python scripts/cluster.py detruire
      - name: Image publiée du modèle, signature et provenance vérifiées
        # seule exception, avec modele.yml, à « aucun téléchargement du modèle en CI » :
        # le mode réel ne démarre pas sans lui (ADR 005)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/cluster.py tirer-modele
      - name: Cluster k3d de trois nœuds, registre local
        run: uv run --no-sync python scripts/cluster.py creer
      - name: Images poussées dans le registre local, tirées par empreinte
        run: uv run --no-sync python scripts/cluster.py images --dossier "$RUNNER_TEMP/cluster"
      - name: Composants, base, proxy, serveur factice, application
        run: uv run --no-sync python scripts/cluster.py installer --dossier "$RUNNER_TEMP/cluster"
      - name: Scénarios (concurrence, arrêt, mise à jour, retour arrière, réseau, contrôle, restauration)
        run: uv run --no-sync pytest -m cluster --cluster="$RUNNER_TEMP/cluster"
      - name: Diagnostic en cas d'échec
        id: diagnostic-cluster
        if: failure()
        run: |
          KC=.cache/cluster/kubeconfig
          df -h /
          kubectl --kubeconfig "$KC" --context k3d-cdg get pods,jobs,events -A || true
          kubectl --kubeconfig "$KC" --context k3d-cdg logs -n cdg -l app.kubernetes.io/instance=cdg --all-containers --tail=200 || true
      - name: Espace disque restant, à comparer au besoin calculé
        id: diagnostic-espace-disque
        if: always()
        run: df -h /
      - name: Cluster détruit, quoi qu'il arrive
        if: always()
        run: uv run --no-sync python scripts/cluster.py detruire

  publication:
    name: publication (${{ matrix.image }}, ghcr.io, signature, attestations)
    # après une fusion dans main seulement : ni pull request, ni lundi. Les images publiées
    # sont celles que le job image a construites, testées, inventoriées et scannées sur
    # chaque architecture, jamais reconstruites ; un index les réunit. Mêmes étapes pour
    # l'application et le proxy de sortie (PR C3)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, types, audit, tests, chart, image, cluster]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: application
            artefact: image
            locale: cdg:verification
            depot: ""
          - image: proxy de sortie
            artefact: proxy
            locale: cdg-proxy:verification
            depot: /proxy-sortie
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # pousser les images sur ghcr.io
      id-token: write # identité OIDC du workflow : signature sans clé, attestations
      attestations: write # attestations de provenance et d'inventaire
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.depot }}
      ARTEFACT: ${{ matrix.artefact }}
      LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.artefact }}-* # un dossier par architecture (image-amd64…)
          path: ${{ runner.temp }}/chaine
      - name: Connexion à ghcr.io (jeton du workflow ; droit packages limité à ce job)
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publication de chaque architecture, empreinte relue dans le registre
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/chaine/$ARTEFACT-$arch/image.tar"
            docker tag "$LOCALE" "$IMAGE:sha-$GITHUB_SHA-$arch"
            docker image rm "$LOCALE"
            docker push "$IMAGE:sha-$GITHUB_SHA-$arch"
            digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA-$arch" \
              --format '{{json .Manifest}}' | jq -r .digest)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "empreinte publiée illisible ($arch) : $digest" >&2
              exit 1
            fi
            echo "DIGEST_$(tr '[:lower:]' '[:upper:]' <<< "$arch")=$digest" >> "$GITHUB_ENV"
          done
      - name: Index amd64 et arm64, étiqueté par le commit
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE@$DIGEST_AMD64" "$IMAGE@$DIGEST_ARM64"
          manifest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" \
            --format '{{json .Manifest}}')"
          digest="$(jq -r .digest <<< "$manifest")"
          platforms="$(jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"]
            | sort | join(",")' <<< "$manifest")"
          test "$platforms" = "linux/amd64,linux/arm64" || {
            echo "plateformes de l'index inattendues : $platforms" >&2
            exit 1
          }
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "empreinte de l'index illisible : $digest" >&2
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3 # celui des vérifications (scripts/chaine.py)
      - name: Signature sans clé de l'index et de chaque image qu'il désigne
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"
      - name: Attestation de provenance (SLSA), sur l'index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          create-storage-record: false # dépôts d'organisation seulement
      - name: Attestation de l'inventaire amd64 (SPDX 2.3, Syft), celui qui a été scanné
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST_AMD64 }}
          sbom-path: ${{ runner.temp }}/chaine/${{ matrix.artefact }}-amd64/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attestation de l'inventaire arm64 (SPDX 2.3, Syft), celui qui a été scanné
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST_ARM64 }}
          sbom-path: ${{ runner.temp }}/chaine/${{ matrix.artefact }}-arm64/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Vérification de ce qui est publié (signatures, provenance, inventaires)
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
          WORKFLOW: ${{ github.repository }}/.github/workflows/ci.yml
        run: |
          for digest in "$DIGEST" "$DIGEST_AMD64" "$DIGEST_ARM64"; do
            cosign verify "$IMAGE@$digest" --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
          gh attestation verify "oci://$IMAGE@$DIGEST" --owner "$GITHUB_REPOSITORY_OWNER" \
            --signer-workflow "$WORKFLOW"
          for digest in "$DIGEST_AMD64" "$DIGEST_ARM64"; do
            gh attestation verify "oci://$IMAGE@$digest" --owner "$GITHUB_REPOSITORY_OWNER" \
              --signer-workflow "$WORKFLOW" --predicate-type https://spdx.dev/Document/v2.3
          done
      - name: Empreintes publiées ; le chart référence celle de l'index
        run: |
          {
            echo "### Image publiée : $IMAGE"
            echo
            echo "- index : \`$IMAGE@$DIGEST\`"
            echo "- amd64 : \`$IMAGE@$DIGEST_AMD64\`"
            echo "- arm64 : \`$IMAGE@$DIGEST_ARM64\`"
            echo
            echo "Signées sans clé, provenance et inventaires attestés (ADR 005)."
          } >> "$GITHUB_STEP_SUMMARY"
