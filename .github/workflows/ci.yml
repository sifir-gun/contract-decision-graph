# Intégration continue : lint, puis toute la suite de tests, tests pg compris, sur une base
# PostgreSQL + pgvector jetable. Les tests llm (vrai modèle, payants) restent exclus : aucun
# secret, aucun appel à un fournisseur LLM, aucun téléchargement du modèle d'embedding.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # audit hebdomadaire de main : une faille publiée entre deux commits est vue sans
  # attendre le suivant ; lint, types et tests ne tournent pas sur ce déclenchement
  schedule:
    - cron: "17 7 * * 1" # lundi 7 h 17, après Dependabot, hors du début d'heure chargé
      timezone: "Europe/Paris"

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19" # celle du poste de développement ; uv.lock vérifié avec elle
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances de développement, strictement depuis uv.lock
        run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ruff check

  types:
    name: types (mypy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances, strictement depuis uv.lock (mypy lit les types des bibliothèques)
        run: uv sync --locked
      - name: mypy, strict sur domain/, ports/ et application/ (configuration dans pyproject.toml)
        run: uv run --no-sync mypy

  audit:
    name: audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: pip-audit, strictement depuis uv.lock (groupe audit)
        run: uv sync --locked --only-group audit
      - name: Dépendances de uv.lock, tous groupes, figées avec leurs empreintes
        # pip-audit 2.10 ne lit pas uv.lock : export au format requirements, sans le projet
        run: >-
          uv export --locked --all-groups --no-emit-project --format requirements-txt
          --output-file "$RUNNER_TEMP/requirements-audit.txt"
      - name: Audit, échec sur toute faille connue (code de sortie 1)
        # --require-hashes et --disable-pip : aucune résolution, les versions de uv.lock
        # telles quelles ; --strict : un paquet introuvable fait aussi échouer l'audit
        run: >-
          uv run --no-sync pip-audit --require-hashes --disable-pip --strict
          --requirement "$RUNNER_TEMP/requirements-audit.txt"
      - name: Projet, sans le groupe dev, pour le contrôle des échéances du corpus
        run: uv sync --locked --no-dev
      - name: Échéances du corpus, échec si une source expire dans les 60 jours
        # aussi chaque lundi : le déclenchement planifié ne lance que ce job
        run: uv run --no-sync python scripts/echeances_corpus.py --jours 60

  tests:
    name: tests (PostgreSQL + pgvector)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 16.11 + pgvector 0.8.1 : même image et même empreinte que docker-compose.yml
        image: pgvector/pgvector:pg16@sha256:0a07c4114ba6d1d04effcce3385e9f5ce305eb02e56a3d35948a415a52f193ec
        env:
          POSTGRES_USER: cdg_admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: cdg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cdg_admin -d cdg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # base jetable, détruite avec le job : ces mots de passe ne protègent rien, ce ne sont
      # pas des secrets
      POSTGRES_USER: cdg_admin
      POSTGRES_PASSWORD: ci-admin
      POSTGRES_DB: cdg
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      APP_DB_PASSWORD: ci-app
      LANGSMITH_TRACING: "false"
      # garde-fou : un téléchargement Hugging Face échouerait au lieu de tirer 2,2 Go
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances, strictement depuis uv.lock
        run: uv sync --locked
      - name: Migrations, par le script d'init du dépôt exécuté dans le conteneur
        # un conteneur de service démarre avant le checkout : il ne peut pas monter
        # docker/initdb comme le fait docker-compose.yml
        run: |
          docker cp migrations "${{ job.services.postgres.id }}:/migrations"
          docker exec -i -e APP_DB_PASSWORD "${{ job.services.postgres.id }}" \
            bash -s < docker/initdb/00_migrate.sh
      - name: setup-db (tables du checkpointer, droits d'app_role)
        run: uv run --no-sync python -m cdg.cli setup-db
      - name: Tests, tests pg compris (tests llm exclus par défaut), couverture et seuil
        # seuil : fail_under de [tool.coverage.report], lu par pytest-cov
        run: uv run --no-sync pytest --cov --cov-report=term

  image:
    name: image (construction et vérifications)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Dépendances, strictement depuis uv.lock (pytest et httpx pour les vérifications)
        run: uv sync --locked
      - name: Construction, bases figées par empreinte, dépendances strictement depuis uv.lock
        # l'image n'est ni publiée ni signée ici : c'est l'objet de la PR B (ADR 005)
        run: docker build --tag cdg:verification .
      - name: Vérifications de l'image construite (non root, lecture seule, sans shell)
        run: uv run --no-sync pytest -m image --image cdg:verification
