      "79": "hors périmètre : cité seulement par l'art. 82, lui-même cité par l'art. 28"

  code-commerce:
    format: legifrance
    citation: C. com.
    directory: code-commerce
    file: "{article}.txt"
    retrieved_at: 2026-09-24
    articles:
      "L441-10": [financier]
      "L442-1": [operationnel, juridique]

  code-civil:
