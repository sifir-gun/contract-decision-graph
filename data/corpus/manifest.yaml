# Ce qui est ingéré dans rag_chunks, et sous quel domaine (filtre de recherche).
# Règle de périmètre et justification de chaque article : SOURCES.md.
# Tout fichier de raw/ doit figurer ici, ingéré ou exclu (vérifié par les tests).

sources:
  rgpd:
    format: eurlex
    citation: RGPD
    directory: rgpd
    file: "art-{article}.txt"
    retrieved_at: 2026-09-24
