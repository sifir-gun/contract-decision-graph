# Jeu de démonstration (J4) : 10 contrats synthétiques et 2 contrats piégés ; au J5, un
# contrat rédigé de façon réaliste (`realistic`). Aucune partie réelle, aucune donnée
# personnelle réelle. Pour chaque contrat : les parties à masquer (--party), les clauses
# qu'une extraction correcte rend (citations exactes, présentes dans le texte masqué) et
# la décision attendue, avec la décision humaine quand le contrat passe en revue. Vérifié
# par tests/test_demo.py, doublures à la place du LLM et du CRAG. Les passages sur modèle
# réel et le coût par contrat relèvent du J5.
#
# Chaque règle du projet se déclenche dans au moins un contrat (test_demo.py).
# Chaque contrat déclare son profil (`profile`, obligatoire, sans valeur par défaut : ADR 010).
# PR 2 des profils : sept contrats du profil `sous_traitance` (`st-*`), dont un réaliste.

analysis_date: 2026-09-25

