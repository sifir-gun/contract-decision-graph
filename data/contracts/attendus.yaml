# Jeu de démonstration (J4) : 10 contrats synthétiques et 2 contrats piégés.
# Aucune partie réelle, aucune donnée personnelle réelle. Pour chaque contrat : les parties
# à masquer (--party), les clauses qu'une extraction correcte rend (citations exactes,
# présentes dans le texte masqué) et la décision attendue, avec la décision humaine quand
# le contrat passe en revue. Vérifié par tests/test_demo.py, doublures à la place du LLM
# et du CRAG. Les passages sur modèle réel et le coût par contrat relèvent du J5.
#
# Chaque règle du projet se déclenche dans au moins un contrat (test_demo.py).

