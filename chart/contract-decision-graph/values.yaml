# Valeurs du chart contract-decision-graph (ADR 005). Schéma : values.schema.json ; toute
# valeur inconnue ou mal formée fait échouer l'installation. Aucun secret ici : les
# Secrets sont créés à part, et le chart ne fait que les nommer.

# Mode de l'interface : « reel » (base, modèle d'embedding, LLM) ou « demo » (en mémoire,
# ni base, ni modèle, ni clé : profil local réduit).
mode: reel

# Image de l'application : l'empreinte de l'index amd64/arm64 publié par la CI (résumé du
# run de publication), jamais une étiquette.
image:
  repository: ghcr.io/sifir-gun/contract-decision-graph
  digest: sha256:0727136980b36b63f0e86e2e5a3a5a6b1178bf535b96fd5796966e2021fd716d
  pullPolicy: IfNotPresent

# Poids du modèle d'embedding : image dédiée, montée en lecture seule (mode réel).
modele:
  image:
    repository: ghcr.io/sifir-gun/contract-decision-graph/modele-embedding
    digest: sha256:97111c7a4bde523af411eaeb4430b3dcd82bc05b5e56747f739cafbd1244d570
    pullPolicy: IfNotPresent
  # « image » : volume image (Kubernetes 1.36, stable) ; « copie » : pour un cluster sans
  # volume image, deux conteneurs d'initialisation copient les poids dans un volume
  # éphémère (busybox fournit le programme de copie, l'image du modèle n'en a aucun)
  montage: image
  copie:
    busybox:
      repository: docker.io/library/busybox
      # busybox 1.37.0-musl, image officielle de Docker (index amd64/arm64)
      digest: sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    # taille du volume éphémère qui reçoit les poids (2,2 Go)
    tailleMax: 3Gi

# Réplicas de l'interface. Pas d'autoscaling : la charge est de l'attente du LLM, bornée par
# le quota de Mistral, pas par le CPU (ADR 005).
replicas: 2

web:
  # arrêt propre : pause avant l'arrêt (retrait du service), puis délai laissé aux requêtes
  pauseAvantArret: 10
  delaiArret: 60
  repriseIntervalle: 60
  # taille du pool de connexions d'app_role (ADR 005, budget de connexions)
  connexions: 10
  portSante: 8081

# Ressources, fixées d'après la mesure du 28/09 (scripts/mesure_memoire.py, ADR 005).
# La limite CPU est un entier : elle fixe aussi le nombre de fils de calcul de l'embedder.
ressources:
  reel:
    # 1,55 Gio une fois prêt, 2,55 à 2,65 Gio au chargement du modèle (pic mesuré)
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "2", memory: 4Gi}
  demo:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}
  ingestion:
    # 2,9 Gio au pic avec des lots de 16 (embedding.lot)
    requests: {cpu: "2", memory: 3Gi}
    limits: {cpu: "2", memory: 4Gi}
  jobs:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  copie:
    requests: {cpu: 100m, memory: 32Mi}
    limits: {cpu: "1", memory: 64Mi}

# Taille des lots d'embeddings (mesure du 28/09, ADR 005) : fastembed en prend 256 par
# défaut, et l'ingestion dépassait toute limite raisonnable ; 16 bornent son pic à 2,9 Gio
# (64 : plus de 3,7 Gio).
embedding:
  lot: 16

# Volume éphémère /tmp (système de fichiers racine en lecture seule).
tmp:
  tailleMax: 64Mi

# Répartition et disponibilité.
repartition:
  # DoNotSchedule en production (réplicas sur des nœuds différents) ; ScheduleAnyway sur
  # un cluster d'un seul nœud
  siImpossible: DoNotSchedule
budgetInterruption:
  minDisponibles: 1

# PostgreSQL (opérateur CloudNativePG en PR C3) : adresse et Secrets existants.
base:
  hote: cdg-postgres-rw
  port: 5432
  nom: cdg
  # mot de passe d'app_role : Secret existant
  application:
    secret: cdg-base-application
    cle: password
  # administrateur (migrations, ingestion) : Secret existant
  administrateur:
    secret: cdg-base-administrateur
    cleUtilisateur: username
    cleMotDePasse: password
  # pods de PostgreSQL, pour les règles de sortie
  selecteur:
    cnpg.io/cluster: cdg-postgres

# LLM : clé dans un Secret existant ; adresse de l'API vide = celle du SDK
# (https://api.mistral.ai). Le proxy de sortie ne laisse passer que l'API de Mistral.
llm:
  secret: cdg-mistral
  cle: MISTRAL_API_KEY
  adresseApi: ""

# Proxy de sortie (Smokescreen, PR C3) : seule sortie vers Internet.
proxy:
  url: http://cdg-proxy:4750
  port: 4750
  selecteur:
    app.kubernetes.io/name: cdg-proxy

# Authentification (PR D1, ADR 005) : oauth2-proxy en conteneur annexe, seul chemin vers
# l'interface, qui vérifie le jeton d'identité signé de chaque requête. Désactivée : aucune
# entrée réseau (ni Service de l'interface, ni Ingress).
authentification:
  active: false
  emetteur: ""  # émetteur OIDC, en https
  clientId: ""  # client OIDC : audience du jeton
  # Secret existant : client-secret (secret du client OIDC), cookie-secret (32 octets,
  # chiffrement du cookie de session) ; montés en fichiers dans oauth2-proxy seulement
  secret: cdg-oidc
  # ConfigMap existante (clé ca.crt) : autorités du fournisseur ; vide, celles du système
  autorites: ""
  # déconnexion : fermer aussi la session chez le fournisseur, s'il publie une fin de
  # session (non avec Dex 2.45.1, fournisseur des tests)
  deconnexionFournisseur: false
  # écran d'accord chez le fournisseur (approval_prompt d'oauth2-proxy, qui envoie
  # « force » si rien n'est réglé) : « auto » ne le force pas, et les fournisseurs qui ne
  # connaissent pas ce paramètre l'ignorent ; « force » le demande à chaque connexion
  accord: auto
  session:
    duree: 8h  # cookie-expire
    revalidation: 5m  # cookie-refresh : un compte retiré perd l'accès dans ce délai
  image:
    repository: ghcr.io/sifir-gun/contract-decision-graph/oauth2-proxy
    digest: ""  # index publié par la CI (oauth2-proxy v7.15.4, binaire vérifié)
    pullPolicy: IfNotPresent
  port: 4180
  ressources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}

# Entrée réseau (PR D1) : Ingress Traefik (≥ 3.7.13) en TLS, exige l'authentification.
ingress:
  active: false
  hote: ""  # nom public de l'interface
  classe: traefik
  # Secret TLS de l'hôte ; émis par cert-manager si emetteurCertificat nomme un
  # ClusterIssuer, sinon fourni
  secretTls: cdg-tls
  emetteurCertificat: ""
  hstsSecondes: 31536000
  # limitation de débit par adresse du client (préservée : externalTrafficPolicy Local)
  debit:
    moyenne: 20
    rafale: 40
    periode: 1s
  traefik:
    espaceDeNoms: traefik
    selecteur:
      app.kubernetes.io/name: traefik

# DNS du cluster, pour les règles de sortie.
dns:
  espaceDeNoms: kube-system
  selecteur:
    k8s-app: kube-dns

# Tâches Helm.
taches:
  # conserver une tâche terminée, puis la supprimer (secondes)
  conservation: 3600
  tentatives: 2
  migrations:
    active: true
  ingestion:
    active: true
  # avant une mise à jour : refuse si des contrats en attente ont été analysés sous une
  # autre configuration (ADR 005) ; passerOutre, en connaissance de cause seulement
  controleConfiguration:
    active: true
    passerOutre: false

# Configuration de décision : par défaut files/decision.yaml, copie de config/decision.yaml
# (un test vérifie qu'elles sont identiques). Une autre configuration se passe ici, en texte.
configuration:
  decision: ""

# Quota et limites par défaut de l'espace de noms, où vivent les trois charts. Limites de
# CPU au pire, aux valeurs par défaut : bascule vers une base restaurée, 16 cœurs (trois
# pods de l'interface pendant la mise à jour, oauth2-proxy compris, 3 × 2,5 ; proxy de
# sortie, 2 × 0,5 ; trois instances PostgreSQL avec leur annexe, 3 × 2,5), plus un de
# marge (pod de test de Helm, tâche). Vérifié par tests/test_chart.py (PR D1).
espaceDeNoms:
  quota:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "17"
    limits.memory: 20Gi
    pods: "20"
  limitesParDefaut:
    defaut: {cpu: 500m, memory: 256Mi}
    requeteParDefaut: {cpu: 100m, memory: 128Mi}
    max: {cpu: "4", memory: 6Gi}
