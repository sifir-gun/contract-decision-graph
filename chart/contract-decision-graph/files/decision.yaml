# Configuration de décision du projet : tout ce qui se règle vit ici.
# Validée au démarrage par cdg.config.DecisionConfig ; invalide, le programme s'arrête.
# Valeurs propres au projet, sans reprise d'aucune mission client.

# Poids par domaine dans le score agrégé (somme = 1). Score : 1 = favorable.
weights:
  juridique: 0.30
  financier: 0.25
  conformite: 0.25
  operationnel: 0.20

# Seuils sur le score agrégé : GO >= go, GO_RESERVES >= go_reserves, sinon NO_GO.
thresholds:
  go: 0.75
  go_reserves: 0.50

# Marge minimale au seuil le plus proche ; en dessous, passage humain.
min_margin: 0.05

# Écart de score entre domaines (retrieval OK) au-delà duquel on escalade.
conflict_gap: 0.5

budget:
  max_tokens_per_contract: 60000   # tokens_in + tokens_out, toutes étapes confondues

extraction:
  max_attempts: 2
  # Vérification des absences (J4) : une clause déclarée absente alors que le texte masqué
  # contient l'un de ces termes (casse et typographie ignorées) est redemandée avec un
  # retour ciblé, puis escaladée. Listes imparfaites : une couche de défense parmi d'autres.
  absence_terms:
    responsabilite_acheteur:
      - responsabilité de l'acheteur
      - l'acheteur répond
      - responsabilité du client
      - le client répond
      - le client ne répond
      - l'acheteur ne répond
    responsabilite_fournisseur:
      - responsabilité du prestataire
      - responsabilité du fournisseur
      - responsabilité du titulaire
      - le prestataire répond
      - le fournisseur répond
    revision_prix:
      - révision des prix
      - révision du prix
      - révision des tarifs
      - prix sont révisés
      - prix peuvent être révisés
      - peut être révisé
      - peuvent être révisés
      - indexation
      - prix sont indexés
      - tarifs sont indexés
      - prix indexés
    penalites_execution:
      - pénalités d'exécution
      - clause pénale
      - redevable de pénalités
      - donne lieu à des pénalités
      - pénalités de retard de livraison
      - pénalités de retard d'exécution
      - réfaction
      - refaction
    delai_paiement:
      - payables à
      - payable à
      - payables dans
      - payable dans
      - délai de paiement
      - délai de règlement
    duree_engagement:
      - conclu pour une durée
      - conclu pour la durée
      - durée ferme
      - durée d'engagement
      - durée du contrat
    preavis_resiliation:
      - préavis
    donnees_personnelles:
      - données à caractère personnel
      - données personnelles
      - annuaire
      - noms et prénoms
      - nom et prénom
      - adresse électronique
      - adresses électroniques
      - données des utilisateurs
      - données des salariés
    accord_traitement_donnees:
      - accord de traitement
      - accord de sous-traitance
      - article 28 du règlement
    transfert_hors_ue:
      - données sont hébergées
      - hébergement des données
      - transfert de données
      - transfert des données
      - pays tiers
      - hors de l'union
      # localisation et hébergement des données (J5, série 7) : ancrés sur les données
      # ou les serveurs, jamais sur « hébergement » seul, objet d'un contrat d'hébergement
      - sont traitées et hébergées
      - données sont stockées
      - localisation des données
      - serveurs sont situés
      - centre de données situé
      - centres de données situés
      - territoire de l'union
      - hors de l'ue
      - hors de l'espace économique européen
      - en dehors de l'union
  # Cohérence entre catégorie et citation (J5, après la série 6) : pour chaque type à
  # catégorie, des termes par catégorie, de la plus spécifique à la moins spécifique.
  # Parmi les catégories dont un terme figure dans la citation (casse et typographie
  # ignorées), la première l'emporte ; si ce n'est pas la catégorie rendue, la clause est
  # redemandée avec un retour ciblé, puis escaladée. Une citation qui n'évoque aucune
  # catégorie n'est pas contrôlée. Listes imparfaites : une couche de défense parmi d'autres.
  category_terms:
    delai_paiement:
      facture_periodique:
        - factures périodiques
        - facture périodique
        - factures récapitulatives
        - facture récapitulative
        - facturation périodique
      fin_de_mois:
        - jours fin de mois
        - jours fin du mois
      date_facture:
        - date d'émission
        - date de facture
        - date de la facture
        - date de facturation
    transfert_hors_ue:
      clauses_contractuelles_ad_hoc_autorisees:
        - autorisées par l'autorité de contrôle
        - autorisation de l'autorité de contrôle
        - autorisées par la cnil
        - autorisation de la cnil
      clauses_contractuelles_types:
        - clauses types
        - clauses contractuelles types
        - clauses contractuelles standard
      clauses_contractuelles_ad_hoc:
        - clauses ad hoc
        - clauses contractuelles ad hoc
        - négociées entre les parties
        - clauses contractuelles spécifiques
      regles_entreprise_contraignantes:
        - règles d'entreprise contraignantes
      code_conduite:
        - code de conduite
      certification:
        - mécanisme de certification
        - mécanismes de certification
      decision_adequation:
        - décision d'adéquation
        - niveau de protection adéquat
      aucune_garantie:
        - sans garantie particulière
        - sans garantie appropriée
        - sans garanties appropriées
        - aucune garantie appropriée
        - consentement explicite
      sans_transfert:
        - aucun transfert
        - exclusivement dans l'union
        - exclusivement dans l'espace économique européen
        - exclusivement en france
        - aucun pays tiers

# Règles par domaine : seuils et pénalités de score (retirées de 1,0).
rules:
  juridique:
    supplier_cap_min_pct: 100          # plafond fournisseur, % du montant annuel
    supplier_cap_score_penalty: 0.5
  financier:
    # pénalités d'exécution dues par le fournisseur (C. civ., art. 1231-5)
    execution_penalties_min_cap_pct: 5        # plafond minimal, % du montant du contrat
    execution_penalties_score_penalty: 0.4    # aussi appliquée si la clause est absente
    # délai de paiement par l'acheteur (C. com., art. L441-10) : choix de politique d'achat
    payment_delay_max_days_invoice: 60        # jours à compter de la date de facture
    payment_delay_max_days_end_of_month: 45   # jours fin de mois
    payment_delay_max_days_periodic_invoice: 45  # jours après une facture périodique
    payment_delay_score_penalty: 0.2          # au-delà, ou délai présent mais non chiffré
  conformite:
    # transfert hors UE (RGPD, art. 44 à 46) : la règle juge ce que dit le contrat,
    # jamais une liste de pays. Garanties nommées acceptées :
    transfer_safeguards:
      - decision_adequation
      - clauses_contractuelles_types              # adoptées ou approuvées par la Commission
      - clauses_contractuelles_ad_hoc_autorisees  # autorisation de l'autorité mentionnée
      - regles_entreprise_contraignantes
      - code_conduite
      - certification
    # clauses ad hoc sans mention d'autorisation (art. 46, par. 3, a) : pénalité et constat
    # « autorisation de l'autorité de contrôle à vérifier », pas de blocage
    transfer_authorization_to_verify:
      - clauses_contractuelles_ad_hoc
    transfer_authorization_score_penalty: 0.3
    unlocated_data_score_penalty: 0.3   # localisation des données non précisée
  operationnel:
    commitment_max_months: 36
    commitment_score_penalty: 0.3
    notice_max_months: 6
    notice_score_penalty: 0.3

# Profil sous_traitance (ADR 010, PR 2) : ses réglages, validés contre ses neuf types de
# clauses. Les sections `extraction` et `rules` ci-dessus sont celles du profil fournisseur ;
# tout le reste (poids, seuils, marge, écart de conflit, budget, politique d'arbitrage,
# contrôle de l'entrée, LLM, CRAG, explication, reprises) est commun aux deux profils.
# Valeurs de démonstration, à valider avec le cabinet (spec des profils, « Questions »).
sous_traitance:
  # Règles par domaine : seuils et pénalités de score (retirées de 1,0).
  rules:
    juridique:
      subcontractor_cap_min_pct: 100          # plafond du sous-traitant, % du montant du contrat
      subcontractor_cap_score_penalty: 0.5
      # protection des dessins et documents remis : chaque catégorie dans une seule liste
      design_accepted: [usage_limite_au_projet]
      design_penalized: [confidentialite_seule]
      design_blocking: [reutilisation_autorisee]
      design_score_penalty: 0.3               # confidentialité seule, ou clause absente
    financier:
      # pénalités de retard d'exécution dues par le sous-traitant (C. civ., art. 1231-5)
      execution_delay_penalties_min_cap_pct: 5        # plafond minimal, % du montant du contrat
      execution_delay_penalties_score_penalty: 0.4    # sous le minimum, ou clause absente
      # délai de paiement par le donneur d'ordre (C. com., art. L441-10)
      payment_delay_max_days_invoice: 60              # jours à compter de la date de facture
      payment_delay_max_days_end_of_month: 45         # jours fin de mois
      payment_delay_max_days_periodic_invoice: 45     # jours après une facture périodique
      payment_delay_score_penalty: 0.2                # au-delà, ou délai présent mais non chiffré
    conformite:
      # obligation de certification : la clause absente est un blocage, sans réglage
      certification_accepted: [norme_et_preuves]
      certification_penalized: [norme_sans_preuves, conformite_generale]
      certification_score_penalty: 0.3
      # assurance du sous-traitant
      insurance_min_eur: 2000000              # montant garanti par sinistre, en euros
      insurance_score_penalty: 0.3            # sous le minimum, non chiffrée, ou absente
    operationnel:
      # délai d'exécution : la clause absente est pénalisée comme un délai indicatif
      schedule_accepted: [date_contractuelle]
      schedule_penalized: [delai_indicatif]
      schedule_score_penalty: 0.4
  # Vérification des absences (comme `extraction.absence_terms`) : un terme qui évoque la
  # clause, dans le texte masqué, interdit de la déclarer absente. Termes ancrés, pour ne
  # pas redemander une clause bien extraite : ni « pénalités de retard » seul, ni « donne
  # lieu à des pénalités » (en droit commercial, les pénalités de retard de paiement,
  # C. com., art. L441-10, II, ne sont pas celles du sous-traitant) ; ni « assurance »
  # seul (assurance qualité) ; ni « certificat » ou « procès-verbal » seuls (certificat
  # d'assurance, procès-verbal de réception) ; ni « par sinistre » (plafond de
  # responsabilité). Listes imparfaites : une couche de défense parmi d'autres.
  absence_terms:
    responsabilite_donneur_ordre:
      - responsabilité du donneur d'ordre
      - responsabilité de l'entrepreneur principal
      - le donneur d'ordre répond de
      - le donneur d'ordre répond du
      - le donneur d'ordre ne répond
      - l'entrepreneur principal répond de
      - l'entrepreneur principal ne répond
    responsabilite_sous_traitant:
      - responsabilité du sous-traitant
      - le sous-traitant répond de
      - le sous-traitant répond du
      - le sous-traitant ne répond
    protection_design:
      - dessins
      - plans
      - propriété intellectuelle
      - documents remis
    revision_prix:
      - révision des prix
      - révision du prix
      - révision des tarifs
      - prix sont révisés
      - prix peuvent être révisés
      - peut être révisé
      - peuvent être révisés
      - indexation
      - prix sont indexés
      - tarifs sont indexés
      - prix indexés
    delai_paiement:
      - payables à
      - payable à
      - payables dans
      - payable dans
      - délai de paiement
      - délai de règlement
    penalites_retard_execution:
      - pénalités de retard d'exécution
      - pénalité de retard d'exécution
      - pénalités de retard de livraison
      - pénalité de retard de livraison
      - pénalités d'exécution
      - pénalités de retard dans l'exécution
      - pénalités pour retard d'exécution
      - clause pénale
    obligation_certification:
      - certificat de conformité
      - certificats de conformité
      - certification
      - procès-verbal d'essai
      - procès-verbaux d'essai
      - rapport d'essai
      - rapports d'essais
      - norme
    assurance_sous_traitant:
      - attestation d'assurance
      - certificat d'assurance
      - police d'assurance
      - assurance responsabilité civile
      - assurance couvrant
      - souscrit une assurance
      - souscrire une assurance
      - assuré auprès
      - assurée auprès
    delai_execution:
      - délai d'exécution
      - délais d'exécution
      - délai de livraison
      - délais de livraison
      - date de livraison
      - planning
  # Cohérence entre catégorie et citation (comme `extraction.category_terms`) : parmi les
  # catégories dont un terme figure dans la citation, la première l'emporte, d'où l'ordre,
  # du plus spécifique au moins spécifique. « confidentiel » vient après les termes de
  # limite d'usage : une citation qui limite l'usage dit aussi la confidentialité. Les
  # termes de réutilisation sont larges (la racine « réutilis » couvre réutiliser,
  # « peut les réutiliser », réutilise, réutilisation, réutilisable ; « reutilis », la
  # même sans accent, que la comparaison ne retire pas ; « librement », « usage
  # libre »), dans le sens prudent : c'est la catégorie qui bloque, et une citation qui
  # l'évoque n'est jamais lue autrement. Une négation (« n'est autorisé à réutiliser …
  # que pour … ») est donc redemandée, puis revue par un humain : voulu. Les autres
  # types sont ancrés (« certificat » seul est dans « certification » ; « conformes aux
  # normes » seul dit « sans norme nommée », ce qui est la conformité générale, non
  # « norme sans preuves »). La conformité générale vient avant les preuves : des
  # procès-verbaux remis ne nomment pas de norme, et une citation qui renvoie aux normes
  # en vigueur n'est jamais lue `norme_et_preuves` (acceptée). Les termes de la
  # catégorie acceptée sont des formes verbales actives suivies d'un article défini
  # (« remet les procès-verbaux d'essai ») : une négation du verbe s'insère entre le
  # verbe et son objet (« ne remet pas les », « ne remet aucun », « sans remettre les »,
  # « n'est pas tenu de remettre les »), et n'en contient donc aucun. Limite, les termes
  # étant cherchés comme sous-chaînes de la citation : une négation portée par le sujet
  # (« aucun sous-traitant ne remet les procès-verbaux d'essai ») ou une restriction
  # (« ne remet les … que sur demande », « … s'il le juge utile ») contient le terme, et
  # une extraction `norme_et_preuves` n'y est pas contredite (sens favorable). Ceux des
  # catégories pénalisées restent larges. Une forme positive qui manque pousse le modèle
  # vers une pénalité si la citation contient un terme d'une catégorie pénalisée
  # (« conforme à la norme »…), sens prudent ; sinon, la citation n'est pas contrôlée.
  # Une forme qu'une négation contient, au contraire, y pousserait la négation : ni nom
  # de preuve seul (« aucun procès-verbal d'essai n'est exigé »), ni participe (« aucun
  # certificat de conformité remis », « sans rapport d'essai à remettre »), ni
  # « accompagné(e)(s) des … » (« ne sont pas accompagnées des … »), ni « livré avec
  # un … » (« n'est pas livré avec un … »). Chaque preuve est nommée avec son
  # complément : un procès-verbal de réception n'est pas une preuve d'essai.
  category_terms:
    protection_design:
      reutilisation_autorisee:
        - réutilis   # racine : réutiliser, réutilise, réutilisation, réutilisable
        - reutilis   # même racine sans accent : la comparaison garde les accents
        - librement
        - usage libre
      usage_limite_au_projet:
        - seules fins
        - seule fin
        - exclusivement pour
        - uniquement pour
        - seul projet
        - que pour le présent projet
        - que pour le projet
        - utilisé que pour
        - utilisée que pour
        - utilisés que pour
        - utilisées que pour
      confidentialite_seule:
        - confidentiel
        - confidentialité
    obligation_certification:
      conformite_generale:
        - normes en vigueur
        - normes applicables
      norme_et_preuves:
        # formes verbales actives suivies d'un article défini, où une négation s'insère
        # entre le verbe et son objet ; « d'essai » couvre aussi « d'essais » (sous-chaîne)
        # procès-verbaux d'essais
        - remet les procès-verbaux d'essai
        - remettra les procès-verbaux d'essai
        - fournit les procès-verbaux d'essai
        - fournira les procès-verbaux d'essai
        - joint les procès-verbaux d'essai
        - remet le procès-verbal d'essai
        - remettra le procès-verbal d'essai
        - fournit le procès-verbal d'essai
        - fournira le procès-verbal d'essai
        - joint le procès-verbal d'essai
        # certificats de conformité
        - remet les certificats de conformité
        - remettra les certificats de conformité
        - fournit les certificats de conformité
        - fournira les certificats de conformité
        - joint les certificats de conformité
        - remet le certificat de conformité
        - remettra le certificat de conformité
        - fournit le certificat de conformité
        - fournira le certificat de conformité
        - joint le certificat de conformité
        # certificats d'essai
        - remet les certificats d'essai
        - remettra les certificats d'essai
        - fournit les certificats d'essai
        - fournira les certificats d'essai
        - joint les certificats d'essai
        - remet le certificat d'essai
        - remettra le certificat d'essai
        - fournit le certificat d'essai
        - fournira le certificat d'essai
        - joint le certificat d'essai
        # rapports d'essais
        - remet les rapports d'essai
        - remettra les rapports d'essai
        - fournit les rapports d'essai
        - fournira les rapports d'essai
        - joint les rapports d'essai
        - remet le rapport d'essai
        - remettra le rapport d'essai
        - fournit le rapport d'essai
        - fournira le rapport d'essai
        - joint le rapport d'essai
      norme_sans_preuves:
        - conforme à la norme
        - conformes à la norme
        - conformément à la norme
    delai_execution:
      delai_indicatif:
        - indicatif   # couvre « à titre indicatif »
        - indicative
      date_contractuelle:
        - au plus tard le
        - planning contractuel
        - calendrier contractuel
        - date contractuelle
    # même type que dans le profil fournisseur, mêmes termes
    delai_paiement:
      facture_periodique:
        - factures périodiques
        - facture périodique
        - factures récapitulatives
        - facture récapitulative
        - facturation périodique
      fin_de_mois:
        - jours fin de mois
        - jours fin du mois
      date_facture:
        - date d'émission
        - date de facture
        - date de la facture
        - date de facturation

# Politique d'arbitrage humain, appliquée par cdg.policy à chaque reprise.
# Relecteur et motif sont toujours exigés ; une réponse refusée est redemandée.
human_policy:
  allowed_decisions: [GO, GO_RESERVES, NO_GO]   # NO_GO obligatoire, ESCALADE interdite
  allow_block_override: true   # levée d'un blocage dur possible, avec overrides_block et motif
  # false : un blocage dur donne NO_GO et part vers explain, sans humain.
  # true : il part en revue humaine avec NO_GO proposé ; la levée exige overrides_block et motif.
  hard_block_review: false

# Contrôle de l'entrée (validate_input), sur le texte déjà masqué.
input:
  max_chars: 200000        # au-delà : rejet
  min_words: 30            # en dessous : langue non vérifiable, rejet
  min_french_ratio: 0.15   # part minimale de mots-outils français parmi les mots
  # Détection d'instructions (J4) : motifs (expressions régulières, casse ignorée, sur le
  # texte masqué normalisé, ligne par ligne) d'un passage qui s'adresse à l'outil, à une IA
  # ou à un analyste, qui demande d'ignorer des règles ou de conclure une décision. Une
  # ligne qui en contient un devient un constat « tentative d'instruction détectée » et
  # impose la revue humaine, même en cas de blocage dur. Se contourne par paraphrase : une
  # couche de défense parmi d'autres.
  instruction_patterns:
    # demande d'ignorer des règles ou des consignes, en tête de phrase (impératif)
    - '(?:^|[.:;!?]\s+)(?:ignore|ignorez|oublie|oubliez)\s+(?:les|toutes\s+les|tous\s+les|la|le|ces|vos|tes)\b[^.\n]{0,60}\b(?:règles?|consignes?|instructions?|critères?)\b'
    - '\b(?:ignore|disregard|forget)\s+(?:all\s+|any\s+|the\s+|your\s+)?(?:previous\s+|prior\s+|above\s+)?(?:rules|instructions|guidelines)\b'
    # consignes adressées à l'outil, à une IA, à un modèle ou à un analyste
    - '\b(?:consignes?|instructions?|note|message)\s+(?:pour|à|au|aux|à\s+l''attention\s+de|destinée?s?\s+à)\s+(?:l''|le\s+|la\s+|les\s+|un\s+|une\s+)?(?:outil|intelligence\s+artificielle|ia|modèle|assistant|analyste|lecteur\s+automatique)s?\b'
    - '\bà\s+l''attention\s+(?:de\s+l''|du\s+|des\s+)(?:outil|ia|intelligence\s+artificielle|modèle|assistant|analyste)s?\b'
    - '\b(?:en\s+tant\s+qu''|tu\s+es|vous\s+êtes|you\s+are)\s*(?:un|une|an?)?\s*(?:ia|intelligence\s+artificielle|assistant|modèle\s+de\s+langage|ai|language\s+model)\b'
    # demande de conclure une décision (libellés du projet, en majuscules)
    - '\b(?:conclus|concluez|conclure\s+à|rends|rendez|retiens|retenez|donne|donnez)\b[^.\n]{0,40}(?-i:\b(?:NO[\s_-]?GO|GO[\s_-]?RESERVES|GO)\b)'
    - '\bne\s+(?:signale|signalez)\s+(?:aucun|aucune|rien)\b'

# LLM : extraction et explication (modèle principal), juge CRAG (modèle léger). Clés d'API
# dans .env.
# Identifiants figés, jamais d'alias « -latest » : le modèle est scellé dans l'audit.
# Vérifiés le 2026-09-24 dans la documentation officielle (docs.mistral.ai,
# platform.claude.com).
llm:
  provider: mistral   # mistral ou anthropic
  temperature: 0
  max_output_tokens: 4096
  timeout_seconds: 60
  models:
    mistral:
      main: mistral-small-2603   # Mistral Small 4
      light: ministral-8b-2512   # Ministral 3 8B
    anthropic:
      main: claude-sonnet-5
      light: claude-haiku-4-5-20251001

# Embedding local (fastembed, ONNX), multilingue, sans appel réseau à l'exécution.
embedding:
  model: intfloat/multilingual-e5-large   # licence MIT, 1024 dimensions
  dimension: 1024                          # = colonne rag_chunks.embedding (migration 002)
  query_prefix: "query: "                  # préfixes attendus par les modèles e5
  passage_prefix: "passage: "

# Découpage du corpus à l'ingestion : paragraphes regroupés jusqu'à ce nombre de mots
# (environ 1,5 token par mot en français : reste sous la limite de 512 tokens de e5).
corpus:
  chunk_max_words: 300

# CRAG (J3) : recherche, juge de pertinence (modèle léger), réécriture, puis INSUFFISANT.
crag:
  top_k: 4          # extraits par requête (une requête par type de clause), soumis au juge
  max_passes: 2     # recherches au plus : la première, puis une réécriture
  # Recherche dans le corpus (ADR 006) : chaque réglage n'est retenu que si la mesure de la
  # recherche seule progresse (mesure-recherche, détail requête par requête au journal).
  search:
    # un seul extrait par référence parmi les top_k, le plus proche : sans lui, une fiche
    # ou un long article en plusieurs extraits occupe plusieurs rangs
    distinct_references: true

# Reprise d'un analyste sur erreur transitoire (réseau, API), par la RetryPolicy de
# LangGraph, avant que la garde ne transforme l'échec en `failures` (J3).
analyst_retry:
  max_attempts: 3                 # tentatives, la première comprise
  initial_interval_seconds: 1.0
  backoff_factor: 2.0
  max_interval_seconds: 10.0
  jitter: false

# Reprise de l'extraction sur erreur passagère du fournisseur seulement : limite de débit
# (429), erreur serveur (5xx), délai dépassé. Les SDK ne reprennent rien eux-mêmes.
extraction_retry:
  max_attempts: 3                 # tentatives, la première comprise
  initial_interval_seconds: 2.0
  backoff_factor: 2.0
  max_interval_seconds: 20.0
  jitter: false

# Explication (J4) : rédigée par le modèle principal à partir du verdict figé, jamais du
# contrat. Refusée si elle nomme une autre décision que la décision finale, ou cite une
# référence non retenue pour la clause du constat ; après max_attempts essais refusés, ou
# une erreur, gabarit sans LLM. Jamais bloquante : la source et les motifs sont scellés.
explain:
  max_attempts: 2                 # le premier essai, puis une régénération

# Reprise de l'explication sur erreur passagère du fournisseur seulement (429, 5xx, délai
# dépassé), puis gabarit.
explain_retry:
  max_attempts: 3                 # tentatives, la première comprise
  initial_interval_seconds: 2.0
  backoff_factor: 2.0
  max_interval_seconds: 20.0
  jitter: false

# Analyse interrompue (processus arrêté ou mort au milieu d'une analyse, phase Kubernetes) :
# un réplica la reprend depuis son dernier checkpoint. Chaque reprise est comptée en base,
# par contrat, avant d'être faite ; au-delà de max_resumes, plus de reprise automatique :
# ESCALADE vers la revue humaine, avec un rapport d'échec qui cite le nombre de reprises.
interrupted:
  max_resumes: 3                  # reprises au plus, après la première exécution
