{{- if include "cdg.taches" . | trim }}
# Compte des tâches Helm : créé avec elles (crochet), car les tâches d'avant installation
# tournent avant les ressources ordinaires du chart. Aucun droit, aucun jeton monté.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cdg.nomComplet" . }}-taches
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cdg.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: taches
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-weight": "-30"
    # supprimée après son crochet : Helm ne supprime pas une ressource de crochet à la
    # désinstallation (ADR 005)
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
automountServiceAccountToken: false
{{- end }}
