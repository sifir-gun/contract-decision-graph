{{- $reel := eq .Values.mode "reel" -}}
{{- $ressources := ternary .Values.ressources.reel .Values.ressources.demo $reel -}}
{{- $web := dict "racine" . "composant" "web" -}}
{{- $auth := .Values.authentification.active -}}
{{- include "cdg.authentification.valider" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cdg.nomComplet" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cdg.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    # exclusions de kube-linter, justifiées ici et dans l'ADR 005
    ignore-check.kube-linter.io/no-node-affinity: "aucune contrainte de matériel ni de zone : n'importe quel nœud convient, amd64 comme arm64 (images multi-architecture)"
    ignore-check.kube-linter.io/minimum-three-replicas: "deux réplicas par défaut : un réplica réel occupe environ 1 550 Mio mesurés (requête de 2 Gi) ; un troisième réserverait 2 Gi de plus pour une charge bornée par le quota de Mistral, et le budget d'interruption garde un pod disponible (ADR 005)"
    ignore-check.kube-linter.io/dnsconfig-options: "ne résout que des noms internes au cluster ; api.mistral.ai est résolu par le proxy de sortie, qui porte ndots 2 (ADR 005)"
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  # mise à jour progressive sans interruption : un pod de plus, jamais un de moins
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cdg.selecteur" $web | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cdg.etiquettesComposant" $web | nindent 8 }}
      annotations:
        # tout changement de la configuration relance les pods (ADR 005)
        checksum/configuration: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      restartPolicy: Always  # la valeur par défaut, écrite (kube-linter, restart-policy)
      serviceAccountName: {{ include "cdg.nomComplet" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "cdg.securitePod" . | nindent 8 }}
      # pause avant l'arrêt + délai laissé aux requêtes + marge (ADR 005, arrêt propre)
      terminationGracePeriodSeconds: {{ add .Values.web.pauseAvantArret .Values.web.delaiArret 10 }}
      # répartition sur des nœuds différents : stricte par les contraintes de topologie, qui
      # tolèrent le pod en plus d'une mise à jour ; l'anti-affinité, préférée seulement :
      # exigée, elle bloquerait la mise à jour quand il y a autant de nœuds que de réplicas
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "cdg.selecteur" $web | nindent 20 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.repartition.siImpossible }}
          labelSelector:
            matchLabels:
              {{- include "cdg.selecteur" $web | nindent 14 }}
      {{- $copie := ternary (include "cdg.initCopieModele" .) "" $reel }}
      {{- if or $copie $auth }}
      initContainers:
        {{- with $copie }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if $auth }}
        # seul chemin vers l'interface (PR D1) : authentifie, puis transmet le jeton
        # d'identité signé à l'interface, sur la boucle locale du pod. Conteneur annexe
        # natif (conteneur d'initialisation redémarré) : l'interface ne démarre qu'une
        # fois lui prêt, et le kubelet ne l'arrête qu'après elle (ADR 005)
        - name: oauth2-proxy
          restartPolicy: Always
          image: {{ include "cdg.imageOauth2Proxy" . }}
          imagePullPolicy: {{ .Values.authentification.image.pullPolicy }}
          args:
            {{- include "cdg.argsOauth2Proxy" . | nindent 12 }}
          env:
            # fournisseur d'identité par le proxy de sortie ; l'interface, en direct
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.url | quote }}
            - name: NO_PROXY
              value: "127.0.0.1,localhost"
          ports:
            - name: http
              containerPort: {{ .Values.authentification.port }}
              protocol: TCP
          startupProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.authentification.ressources | nindent 12 }}
          securityContext:
            {{- include "cdg.securiteConteneur" . | nindent 12 }}
          volumeMounts:
            - name: secrets-oauth2-proxy
              mountPath: /run/secrets/oauth2-proxy
              readOnly: true
            {{- if .Values.authentification.autorites }}
            - name: autorites
              mountPath: /run/autorites
              readOnly: true
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "cdg.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --journaux
            - json
            {{- if $reel }}
            - --connexions
            - {{ .Values.web.connexions | quote }}
            - --fils-embedding
            - {{ include "cdg.fils" $ressources | quote }}
            - --lot-embedding
            - {{ .Values.embedding.lot | quote }}
            {{- end }}
            - web
            {{- if not $reel }}
            - --demo
            {{- end }}
            # l'interface écoute sur 127.0.0.1 (ADR 004) : jointe par oauth2-proxy, dans
            # le même pod (PR D1), jamais par le réseau
            - --port-sante
            - {{ .Values.web.portSante | quote }}
            - --hote-sante
            - 0.0.0.0
            - --delai-arret
            - {{ .Values.web.delaiArret | quote }}
            - --reprise-intervalle
            - {{ .Values.web.repriseIntervalle | quote }}
            {{- if $auth }}
            # derrière oauth2-proxy : jeton d'identité vérifié à chaque requête (PR D1)
            - --identite
            - en-tetes
            - --oidc-emetteur
            - {{ .Values.authentification.emetteur | quote }}
            - --oidc-audience
            - {{ .Values.authentification.clientId | quote }}
            - --adresse-publique
            - {{ include "cdg.adressePublique" . | quote }}
            # clés CSRF partagées entre réplicas, relues à chaque usage (rotation)
            - --cles-csrf
            - /run/secrets/csrf
            {{- if .Values.authentification.autorites }}
            - --oidc-ca
            - /run/autorites/ca.crt
            {{- end }}
            {{- if .Values.authentification.deconnexionFournisseur }}
            - --deconnexion-fournisseur
            {{- end }}
            {{- end }}
          {{- if or $reel $auth }}
          env:
            {{- if $reel }}
            {{- include "cdg.envBase" . | nindent 12 }}
            - name: EMBEDDING_CACHE_DIR
              value: /modele
            {{- with .Values.llm.adresseApi }}
            - name: MISTRAL_SERVER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            # seule sortie vers Internet : le proxy, qui ne laisse passer que Mistral et,
            # avec l'authentification, le fournisseur d'identité (clés publiques)
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.url | quote }}
            - name: HTTP_PROXY
              value: {{ .Values.proxy.url | quote }}
            - name: NO_PROXY
              value: {{ ternary (printf "%s,127.0.0.1,localhost" .Values.base.hote) "127.0.0.1,localhost" $reel | quote }}
          {{- end }}
          ports:
            - name: sante
              containerPort: {{ .Values.web.portSante }}
              protocol: TCP
          startupProbe:
            # le modèle se charge en 9 à 22 s (mesure du 28/09) : jusqu'à 5 minutes
            httpGet: {path: /sante/demarrage, port: sante}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /sante/vie, port: sante}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /sante/pret, port: sante}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # retiré du service avant l'arrêt ; action native de Kubernetes, sans shell
              sleep:
                seconds: {{ .Values.web.pauseAvantArret }}
          resources:
            {{- toYaml $ressources | nindent 12 }}
          securityContext:
            {{- include "cdg.securiteConteneur" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: configuration
              mountPath: /app/config
              readOnly: true
            {{- if $reel }}
            - name: modele
              mountPath: /modele
              readOnly: true
            {{- include "cdg.montageSecrets" . | nindent 12 }}
            {{- end }}
            {{- if and $auth .Values.authentification.autorites }}
            - name: autorites
              mountPath: /run/autorites
              readOnly: true
            {{- end }}
            {{- if $auth }}
            # sans subPath : le kubelet met le fichier à jour quand le Secret change
            - name: cles-csrf
              mountPath: /run/secrets/csrf
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.tailleMax }}
        - name: configuration
          configMap:
            name: {{ include "cdg.nomComplet" . }}-configuration
        {{- if $reel }}
        {{- include "cdg.volumeModele" . | nindent 8 }}
        {{- include "cdg.volumeSecrets" (dict "racine" . "llm" true "administrateur" false) | nindent 8 }}
        {{- end }}
        {{- if $auth }}
        # secrets d'oauth2-proxy, pour lui seul, en fichiers (0440, groupe du pod)
        - name: secrets-oauth2-proxy
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.authentification.secret }}
                  items:
                    - key: client-secret
                      path: client-secret
                    - key: cookie-secret
                      path: cookie-secret
        # clés CSRF, pour l'interface seule : tout le Secret (courante, precedente)
        - name: cles-csrf
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.authentification.secretCsrf }}
        {{- with .Values.authentification.autorites }}
        - name: autorites
          configMap:
            name: {{ . }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- end }}
