{{- if eq .Values.mode "reel" }}
{{- /*
Configuration à venir, pour les tâches d'avant installation ou mise à jour (contrôle de
configuration, migrations) : les ressources du chart, dont la ConfigMap de l'interface,
ne sont appliquées qu'après ces tâches.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cdg.nomComplet" . }}-configuration-a-venir
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cdg.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: configuration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    # supprimée après son crochet : Helm ne supprime pas une ressource de crochet à la
    # désinstallation (ADR 005)
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  decision.yaml: |-
    {{- default (.Files.Get "files/decision.yaml") .Values.configuration.decision | nindent 4 }}
  tarifs.yaml: |-
    {{- .Files.Get "files/tarifs.yaml" | nindent 4 }}
{{- end }}
