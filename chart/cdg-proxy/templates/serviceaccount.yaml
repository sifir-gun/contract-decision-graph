# Compte dédié, sans aucun droit ni jeton monté : le proxy ne parle pas à l'API de
# Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cdg-proxy.nomComplet" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cdg-proxy.etiquettes" . | nindent 4 }}
automountServiceAccountToken: false
