apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdg-proxy.nomComplet" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cdg-proxy.etiquettes" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdg-proxy.selecteur" . | nindent 4 }}
  ports:
    - name: proxy
      port: {{ .Values.port }}
      targetPort: proxy
      protocol: TCP
