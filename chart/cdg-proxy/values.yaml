# Valeurs du chart cdg-proxy (ADR 005, PR C3). Schéma : values.schema.json ; toute valeur
# inconnue ou mal formée fait échouer l'installation.

# Image du proxy : l'empreinte de l'index amd64/arm64 publié par la CI (résumé du job
# publication), jamais une étiquette.
image:
  repository: ghcr.io/sifir-gun/contract-decision-graph/proxy-sortie
  # index publié par la CI à la fusion de la PR #65 (sha-3426bd6 ; Smokescreen compilé
  # avec Go 1.26.10 et x/net 0.60.0, amendement du 12/10 à l'ADR 005) ; signature cosign
  # et provenance vérifiées le 22/10/2026
  digest: sha256:42322f2a44427b624f83cafb85a981f4de65162b1decbc376393adc1d344ed09
  pullPolicy: IfNotPresent

replicas: 2
port: 4750

# Pause avant l'arrêt, en secondes : le temps d'être retiré des règles du service avant
# que Smokescreen ferme son port (enquête du 05 et 06/10 : jusqu'à 1,47 s mesurées). Même
# valeur que l'interface (web.pauseAvantArret), une seule règle ; 30 s s'y ajoutent pour
# les tunnels ouverts (ADR 005).
pauseAvantArret: 10

# Liste d'accès : seuls ces domaines passent (Smokescreen, politique « enforce »). Sans
# certificat client, toute requête prend la règle par défaut.
domainesAutorises:
  - api.mistral.ai
# Adresses privées : refusées par Smokescreen. Profil de test seulement : la plage des
# services du cluster, pour joindre le serveur factice de Mistral.
plagesAutorisees: []

# Pods autorisés à passer par le proxy (même espace de noms) : l'interface.
clients:
  app.kubernetes.io/name: contract-decision-graph
  app.kubernetes.io/component: web

# Sorties internes au cluster, profil de test seulement : [{espaceDeNoms, selecteur, port}].
sortiesInternes: []

# DNS du cluster, pour les règles de sortie.
dns:
  espaceDeNoms: kube-system
  selecteur:
    k8s-app: kube-dns

# Mesure du 28/09 : 4,7 Mio au repos, 6 Mio après 43 requêtes.
ressources:
  requests: {cpu: 50m, memory: 32Mi}
  limits: {cpu: 500m, memory: 128Mi}

# Protections de Smokescreen contre l'épuisement.
limites:
  requetesSimultanees: 100
  tunnelsSimultanes: 50
delaiConnexion: 10s

repartition:
  siImpossible: DoNotSchedule
budgetInterruption:
  minDisponibles: 1
