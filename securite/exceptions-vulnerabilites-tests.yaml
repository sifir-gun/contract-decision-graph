# Failles admises dans les images de test sans signature (ADR 008, décision du 04/10/2026) :
# la composition de Langfuse, sur le poste et dans le cluster de test de la CI, scannée à
# chaque pull request par le job cluster (scripts/chaine.py images-de-test). À part de
# exceptions-vulnerabilites.yaml : ces exceptions ne couvrent jamais une image du produit,
# scannée contre ses propres exceptions (tests/test_scan_images_de_test.py).
#
# Même format et mêmes règles que pour le produit : faille, paquet (nom, type, version),
# motif, dates ; 90 jours au plus ; une exception expirée fait échouer le scan.
portee: tests (images de la composition de Langfuse, jamais le produit)
exceptions:
  - vulnerabilite: GHSA-ggr8-5vv4-36mx
    paquet: {nom: deepmerge-ts, type: npm, version: 7.1.5}
    motif: >-
      CVE-2026-40345, épuisement de pile en fusionnant des graphes d'objets récursifs
      (déni de service), corrigé en 8.0.0. Dans Langfuse web et worker 4.58.0 (revue du
      13/10 : la 7.1.5 y reste, à côté de la 8.0.2, tirée par @prisma/config 6.19.3, le
      chargeur de configuration de Prisma), que le projet ne construit pas ; images de test
      seulement, joignables depuis l'application seule (cluster) ou le poste (127.0.0.1), et
      du JSON ne peut pas exprimer de cycle. À revoir à la version suivante de Langfuse.
    decidee: 2026-10-13
    expire: 2026-12-31
  - vulnerabilite: CVE-2026-5450
    paquet: {nom: libc6, type: deb, version: 2.41-12+deb13u3}
    motif: >-
      glibc : débordement d'un octet du tas avec la famille scanf et une conversion %mc de
      largeur supérieure à 1024, corrigé en 2.41-12+deb13u4. Dans ClickHouse 25.12.11.4
      distroless, que le projet ne construit pas ; usage improbable par ClickHouse ; image de
      test seulement, sans sortie ni entrée hors de Langfuse. À revoir à la prochaine
      publication de l'image.
    decidee: 2026-10-04
    expire: 2026-12-31
  - vulnerabilite: CVE-2026-5928
    paquet: {nom: libc6, type: deb, version: 2.41-12+deb13u3}
    motif: >-
      glibc : lecture avant le tampon par ungetwc sur un flux en caractères larges d'un jeu
      à recouvrements, corrigé en 2.41-12+deb13u4. Dans ClickHouse 25.12.11.4 distroless,
      que le projet ne construit pas ; usage improbable ; image de test seulement. À revoir
      à la prochaine publication de l'image.
    decidee: 2026-10-04
    expire: 2026-12-31
  - vulnerabilite: CVE-2026-85091
    paquet: {nom: zlib, type: apk, version: 1.3.2-r0}
    motif: >-
      zlib 1.3.1.2 à 1.3.2 : débordement de tas dans gz_vacate() lors d'écritures gzwrite()
      non bloquantes, atteint par gzprintf() ou gzvprintf() après un blocage d'écriture ;
      corrigé en 1.3.2-r1. Dans Valkey 8.1.10-alpine, non republiée au 13/10 (pas de
      8.1.11), que le projet ne construit pas : valkey-server ne lie pas zlib (ldd : libssl,
      libcrypto, musl), seul libapk, le gestionnaire de paquets, en dépend. Image de test
      seulement, sans sortie ni entrée hors de Langfuse. Sortie : la prochaine publication
      de l'image de Valkey ; 30 jours au plus (décision du 13/10).
    decidee: 2026-10-13
    expire: 2026-11-12
  - vulnerabilite: GHSA-8r9p-f939-6h3c
    paquet: {nom: follow-redirects, type: npm, version: 1.16.0}
    motif: >-
      CVE-2026-111755, publiée le 20/10 : l'option sensitiveHeaders, mal échappée dans une
      expression régulière, peut laisser passer des en-têtes d'identification lors d'une
      redirection ; corrigé en 1.16.1. Tiré par axios 1.20.0 dans Langfuse web et worker
      4.58.0, que le projet ne construit pas ; la 4.67.0, dernière version au 21/10, le
      garde (1.16.1 déjà sur la branche principale amont). Images de test seulement,
      joignables depuis l'application seule (cluster) ou le poste (127.0.0.1) ; dans le
      cluster, aucune sortie hors du cluster (règles réseau), donc aucune redirection vers
      une autre origine. Sortie : la première version de Langfuse avec follow-redirects
      1.16.1 et le SDK MCP 1.32.0 ; 30 jours au plus (décision du 21/10).
    decidee: 2026-10-21
    expire: 2026-11-20
  - vulnerabilite: GHSA-q3jh-wrc6-jgq8
    paquet: {nom: follow-redirects, type: npm, version: 1.16.0}
    motif: >-
      CVE-2026-111756, publiée le 20/10 : des en-têtes passés sous forme de tableau
      échappent au retrait des en-têtes d'identification lors d'une redirection vers une
      autre origine ; corrigé en 1.16.1. Tiré par axios 1.20.0 dans Langfuse web et worker
      4.58.0, que le projet ne construit pas ; la 4.67.0, dernière version au 21/10, le
      garde (1.16.1 déjà sur la branche principale amont). Images de test seulement,
      joignables depuis l'application seule (cluster) ou le poste (127.0.0.1) ; dans le
      cluster, aucune sortie hors du cluster (règles réseau), donc aucune redirection vers
      une autre origine. Sortie : la première version de Langfuse avec follow-redirects
      1.16.1 et le SDK MCP 1.32.0 ; 30 jours au plus (décision du 21/10).
    decidee: 2026-10-21
    expire: 2026-11-20
  - vulnerabilite: GHSA-22jm-h49p-29qw
    paquet: {nom: '@modelcontextprotocol/sdk', type: npm, version: 1.31.0}
    motif: >-
      CVE-2026-111767, publiée le 20/10 : les tâches expérimentales d'un serveur MCP ne
      sont pas liées à la session qui les a créées ; corrigé en 1.32.0. Dépendance de
      Langfuse web 4.58.0 (son serveur MCP, /api/public/mcp), présente aussi dans l'image
      du worker, que le projet ne construit pas ; la 4.67.0, dernière version au 21/10, la
      garde (mise à jour proposée en amont le 21/10, langfuse/langfuse#19137 et #19141).
      L'application n'appelle jamais ce serveur ; images de test seulement, joignables
      depuis l'application seule (cluster) ou le poste (127.0.0.1). Sortie : la première
      version de Langfuse avec follow-redirects 1.16.1 et le SDK MCP 1.32.0 ; 30 jours au
      plus (décision du 21/10).
    decidee: 2026-10-21
    expire: 2026-11-20
  - vulnerabilite: GHSA-46jr-4wx8-v453
    paquet: {nom: '@modelcontextprotocol/sdk', type: npm, version: 1.31.0}
    motif: >-
      CVE-2026-111768, publiée le 20/10 : une requête HTTP dans la limite de taille par
      défaut peut épuiser la mémoire d'un serveur MCP pendant sa validation (déni de
      service) ; corrigé en 1.32.0. Dépendance de Langfuse web 4.58.0 (son serveur MCP,
      /api/public/mcp), présente aussi dans l'image du worker, que le projet ne construit
      pas ; la 4.67.0, dernière version au 21/10, la garde (mise à jour proposée en amont
      le 21/10, langfuse/langfuse#19137 et #19141). L'application n'appelle jamais ce
      serveur ; images de test seulement, joignables depuis l'application seule (cluster)
      ou le poste (127.0.0.1). Sortie : la première version de Langfuse avec
      follow-redirects 1.16.1 et le SDK MCP 1.32.0 ; 30 jours au plus (décision du 21/10).
    decidee: 2026-10-21
    expire: 2026-11-20
