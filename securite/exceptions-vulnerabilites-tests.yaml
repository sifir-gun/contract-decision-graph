# Failles admises dans les images de test sans signature (ADR 008, décision du 04/10/2026) :
# la composition de Langfuse, sur le poste et dans le cluster de test de la CI, scannée à
# chaque pull request par le job cluster (scripts/chaine.py images-de-test). À part de
# exceptions-vulnerabilites.yaml : ces exceptions ne couvrent jamais une image du produit,
# scannée contre ses propres exceptions (tests/test_scan_images_de_test.py).
#
# Même format et mêmes règles que pour le produit : faille, paquet (nom, type, version),
# motif, dates ; 90 jours au plus ; une exception expirée fait échouer le scan.
portee: tests (images de la composition de Langfuse, jamais le produit)
exceptions:
  - vulnerabilite: GHSA-ggr8-5vv4-36mx
    paquet: {nom: deepmerge-ts, type: npm, version: 7.1.5}
    motif: >-
      CVE-2026-40345, épuisement de pile en fusionnant des graphes d'objets récursifs
      (déni de service), corrigé en 8.0.0. Dans Langfuse web et worker 4.68.0 (revues du
      13/10 et du 22/10 : la 7.1.5 y reste, à côté de la 8.0.2, tirée par @prisma/config
      6.19.3, le chargeur de configuration de Prisma), que le projet ne construit pas ;
      images de test seulement, joignables depuis l'application seule (cluster) ou le poste
      (127.0.0.1), et du JSON ne peut pas exprimer de cycle. À revoir à la version suivante
      de Langfuse.
    decidee: 2026-10-13
    expire: 2026-12-31
  - vulnerabilite: CVE-2026-5450
    paquet: {nom: libc6, type: deb, version: 2.41-12+deb13u3}
    motif: >-
      glibc : débordement d'un octet du tas avec la famille scanf et une conversion %mc de
      largeur supérieure à 1024, corrigé en 2.41-12+deb13u4. Dans ClickHouse 25.12.11.4
      distroless, que le projet ne construit pas ; usage improbable par ClickHouse ; image de
      test seulement, sans sortie ni entrée hors de Langfuse. À revoir à la prochaine
      publication de l'image.
    decidee: 2026-10-04
    expire: 2026-12-31
  - vulnerabilite: CVE-2026-5928
    paquet: {nom: libc6, type: deb, version: 2.41-12+deb13u3}
    motif: >-
      glibc : lecture avant le tampon par ungetwc sur un flux en caractères larges d'un jeu
      à recouvrements, corrigé en 2.41-12+deb13u4. Dans ClickHouse 25.12.11.4 distroless,
      que le projet ne construit pas ; usage improbable ; image de test seulement. À revoir
      à la prochaine publication de l'image.
    decidee: 2026-10-04
    expire: 2026-12-31
  - vulnerabilite: CVE-2026-85091
    paquet: {nom: zlib, type: apk, version: 1.3.2-r0}
    motif: >-
      zlib 1.3.1.2 à 1.3.2 : débordement de tas dans gz_vacate() lors d'écritures gzwrite()
      non bloquantes, atteint par gzprintf() ou gzvprintf() après un blocage d'écriture ;
      corrigé en 1.3.2-r1. Dans Valkey 8.1.10-alpine, non republiée au 13/10 (pas de
      8.1.11), que le projet ne construit pas : valkey-server ne lie pas zlib (ldd : libssl,
      libcrypto, musl), seul libapk, le gestionnaire de paquets, en dépend. Image de test
      seulement, sans sortie ni entrée hors de Langfuse. Sortie : la prochaine publication
      de l'image de Valkey ; 30 jours au plus (décision du 13/10).
    decidee: 2026-10-13
    expire: 2026-11-12
  - vulnerabilite: GHSA-mchm-gjx6-7h55
    paquet: {nom: '@sentry/nextjs', type: npm, version: 10.64.0}
    motif: >-
      CVE-2026-114139, publiée le 22/10 : avec l'option tunnelRoute, le SDK saute le
      middleware de Next.js sur tout le chemin du tunnel, plus largement que la réécriture
      vers Sentry ; corrigé en 10.75.2. Dans Langfuse web 4.68.0 (absent du worker), que
      le projet ne construit pas ; la 4.68.0, dernière version au 22/10, et la branche
      principale amont gardent la 10.64.0. L'avis exige quatre conditions réunies ; trois
      manquent dans l'image, et une seule suffit : tunnelRoute non posé (commenté dans
      next.config.mjs, aucune réécriture de tunnel compilée), construction Turbopack et non
      webpack, aucun middleware (middleware-manifest.json vide). Images de test seulement,
      joignables depuis l'application seule (cluster) ou le poste (127.0.0.1). Sortie : la
      première version de Langfuse avec @sentry/nextjs 10.75.2 ; 30 jours au plus
      (décision du 22/10).
    decidee: 2026-10-22
    expire: 2026-11-21
