# Exceptions au scan de vulnérabilités de l'image (Grype ; scripts/chaine.py scan ; ADR 005).
# Le scan échoue sur toute faille critique ou haute qui a un correctif. Une exception ne
# couvre qu'une faille, pour un paquet et une version exacts ; elle est justifiée, datée, et
# expire au plus 90 jours après la décision : passé ce délai, le scan échoue jusqu'à ce
# qu'elle soit revue (le job image tourne aussi chaque lundi).
exceptions:
  - vulnerabilite: CVE-2026-82049
    paquet:
      nom: python
      type: binary
      version: 3.12.14
    motif: >-
      Correctif publié pour CPython 3.14 et au-delà seulement : le report sur 3.12
      (python/cpython#157454) n'est pas fusionné au 28/09/2026, et uv 0.12.19 ne propose
      pas de CPython 3.12 plus récent que 3.12.14. La faille touche l'extraction d'archives
      tar piégées par le module tarfile (python/cpython#157190) : le projet n'extrait aucune
      archive, et fastembed ne télécharge jamais de modèle en production
      (HF_HUB_OFFLINE=1). À revoir dès la sortie de CPython 3.12.15.
    decidee: 2026-09-28
    expire: 2026-10-28
  # oauth2-proxy v7.15.4 (PR D1) : binaire de la release, vérifié par l'empreinte publiée
  # (ADR 005, option B) ; ses dépendances ne peuvent donc pas être mises à jour ici. Faits du
  # 30/09/2026 : gRPC n'y est qu'une dépendance indirecte (google.golang.org/api, fournisseur
  # Google, non configuré), ses sources ne l'importent pas et ne créent aucun serveur gRPC ;
  # govulncheck -mode=binary (v1.1.4) sur le binaire publié.
  - vulnerabilite: GHSA-2v4p-qf9q-27wj
    paquet:
      nom: google.golang.org/grpc
      type: go-module
      version: v1.83.0
    motif: >-
      Plantage des serveurs gRPC-Go construits par xds.NewGRPCServer. oauth2-proxy ne
      démarre aucun serveur gRPC : ses ports servent HTTP(S) et les métriques. Le symbole
      transport.http2Server.HandleStreams est lié au binaire (govulncheck), sans serveur
      gRPC pour l'atteindre ; seul Traefik atteint oauth2-proxy (règles réseau). À revoir
      dès la prochaine version d'oauth2-proxy.
    decidee: 2026-09-30
    expire: 2026-10-30
  - vulnerabilite: GHSA-vp52-pcj8-j9qc
    paquet:
      nom: google.golang.org/grpc
      type: go-module
      version: v1.83.0
    motif: >-
      Épuisement mémoire d'un serveur gRPC-Go par des trames DATA fragmentées. Aucun
      serveur gRPC dans oauth2-proxy ; côté client, seul le fournisseur Google appellerait
      des API Google, et il n'est pas configuré (fournisseur OIDC), le proxy de sortie ne
      laissant joindre que le fournisseur d'identité. Symboles du paquet mem liés au
      binaire (govulncheck), sans serveur pour les atteindre. À revoir dès la prochaine
      version d'oauth2-proxy.
    decidee: 2026-09-30
    expire: 2026-10-30
  - vulnerabilite: GO-2026-6354
    paquet:
      nom: golang.org/x/crypto
      type: go-module
      version: v0.55.0
    motif: >-
      Déni de service du paquet golang.org/x/crypto/ssh (canal non encore établi).
      govulncheck -mode=binary : le binaire d'oauth2-proxy n'appelle aucun symbole
      vulnérable ; oauth2-proxy ne fait pas de SSH. À revoir dès la prochaine version
      d'oauth2-proxy.
    decidee: 2026-09-30
    expire: 2026-10-30
  - vulnerabilite: GO-2026-6355
    paquet:
      nom: golang.org/x/crypto
      type: go-module
      version: v0.55.0
    motif: >-
      Déni de service du paquet golang.org/x/crypto/ssh (canal établi).
      govulncheck -mode=binary : le binaire d'oauth2-proxy n'appelle aucun symbole
      vulnérable ; oauth2-proxy ne fait pas de SSH. À revoir dès la prochaine version
      d'oauth2-proxy.
    decidee: 2026-09-30
    expire: 2026-10-30
  # Image de l'application, 01/10/2026 : libssl3t64 de la base distroless cc-debian13, et
  # copies d'OpenSSL réellement chargées, invisibles au scanner, dans la même plage
  # vulnérable. Copies chargées, à surveiller (journal, « à revoir avant le 15/10 ») :
  #   - OpenSSL 3.5.8 de psycopg-binary 3.3.6 (libpq ; psycopg_binary.libs), arm64 et amd64 ;
  #   - OpenSSL 3.5.8 de Python (uv, python-build-standalone, lié statiquement) ;
  #   - OpenSSL 1.1.1k FIPS de Kerberos (psycopg-binary, arm64 seulement), chargée avec
  #     libpq ; gssencmode=disable empêche de l'appeler, sans la retirer de la mémoire.
  # Corrections attendues : psycopg-binary sur OpenSSL 3.5.9 ou plus, Python sur 3.5.9 (uv),
  # republication de distroless. Les images statiques (proxy de sortie, oauth2-proxy) n'ont
  # pas de libssl : ces exceptions ne s'y appliquent pas (vérifié le 01/10/2026).
  - vulnerabilite: CVE-2026-54873
    paquet:
      nom: libssl3t64
      type: deb
      version: 3.5.7-1~deb13u2
    motif: >-
      Cette faille : QUIC (métadonnées des fragments de flux), sévérité basse selon OpenSSL : l'application ne fait pas de QUIC. Avis officiel d'OpenSSL : de 3.5.0 à 3.5.9 exclu ;
      les copies réellement chargées sont donc touchées elles aussi, par leur version :
      OpenSSL 3.5.8 de psycopg-binary et de Python, et, sur arm64, la 1.1.1k FIPS de
      Kerberos. La libssl3t64 de la base, elle, n'est chargée par aucun processus :
      aucune bibliothèque ELF ne la déclare (DT_NEEDED), et ni le serveur ni un processus
      qui utilise chaque dépendance native ne la projette en mémoire (/proc/<pid>/maps),
      sur les images arm64 et amd64. Exposition, selon une lecture du code et non une
      preuve : l'application est cliente TLS seulement (libpq vers PostgreSQL, httpx vers
      Mistral et les clés du fournisseur d'identité) ; ni DTLS, ni QUIC, ni serveur TLS
      (TLS terminé par Traefik, interface sur 127.0.0.1 en HTTP). À retirer quand
      psycopg-binary, Python (uv) et distroless passent à OpenSSL 3.5.9 ou plus.
    decidee: 2026-10-01
    expire: 2026-10-15
  - vulnerabilite: CVE-2026-72897
    paquet:
      nom: libssl3t64
      type: deb
      version: 3.5.7-1~deb13u2
    motif: >-
      Cette faille : serveur TLS qui change de SSL_CTX pendant la négociation, sévérité basse selon OpenSSL : l'application n'est pas un serveur TLS. Avis officiel d'OpenSSL : de 3.5.0 à 3.5.9 exclu ;
      les copies réellement chargées sont donc touchées elles aussi, par leur version :
      OpenSSL 3.5.8 de psycopg-binary et de Python, et, sur arm64, la 1.1.1k FIPS de
      Kerberos. La libssl3t64 de la base, elle, n'est chargée par aucun processus :
      aucune bibliothèque ELF ne la déclare (DT_NEEDED), et ni le serveur ni un processus
      qui utilise chaque dépendance native ne la projette en mémoire (/proc/<pid>/maps),
      sur les images arm64 et amd64. Exposition, selon une lecture du code et non une
      preuve : l'application est cliente TLS seulement (libpq vers PostgreSQL, httpx vers
      Mistral et les clés du fournisseur d'identité) ; ni DTLS, ni QUIC, ni serveur TLS
      (TLS terminé par Traefik, interface sur 127.0.0.1 en HTTP). À retirer quand
      psycopg-binary, Python (uv) et distroless passent à OpenSSL 3.5.9 ou plus.
    decidee: 2026-10-01
    expire: 2026-10-15
  - vulnerabilite: CVE-2026-84782
    paquet:
      nom: libssl3t64
      type: deb
      version: 3.5.7-1~deb13u2
    motif: >-
      Cette faille : retransmission DTLS, sévérité haute selon OpenSSL, qui touche aussi la branche 1.1.1 : l'application ne fait pas de DTLS. Avis officiel d'OpenSSL : de 3.5.0 à 3.5.9 exclu ;
      les copies réellement chargées sont donc touchées elles aussi, par leur version :
      OpenSSL 3.5.8 de psycopg-binary et de Python, et, sur arm64, la 1.1.1k FIPS de
      Kerberos. La libssl3t64 de la base, elle, n'est chargée par aucun processus :
      aucune bibliothèque ELF ne la déclare (DT_NEEDED), et ni le serveur ni un processus
      qui utilise chaque dépendance native ne la projette en mémoire (/proc/<pid>/maps),
      sur les images arm64 et amd64. Exposition, selon une lecture du code et non une
      preuve : l'application est cliente TLS seulement (libpq vers PostgreSQL, httpx vers
      Mistral et les clés du fournisseur d'identité) ; ni DTLS, ni QUIC, ni serveur TLS
      (TLS terminé par Traefik, interface sur 127.0.0.1 en HTTP). À retirer quand
      psycopg-binary, Python (uv) et distroless passent à OpenSSL 3.5.9 ou plus.
    decidee: 2026-10-01
    expire: 2026-10-15
  - vulnerabilite: CVE-2026-84784
    paquet:
      nom: libssl3t64
      type: deb
      version: 3.5.7-1~deb13u2
    motif: >-
      Cette faille : QUIC (file de RETIRE_CONNECTION_ID), sévérité basse selon OpenSSL : l'application ne fait pas de QUIC. Avis officiel d'OpenSSL : de 3.5.0 à 3.5.9 exclu ;
