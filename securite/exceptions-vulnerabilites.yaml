# Exceptions au scan de vulnérabilités de l'image (Grype ; scripts/chaine.py scan ; ADR 005).
# Le scan échoue sur toute faille critique ou haute qui a un correctif. Une exception ne
# couvre qu'une faille, pour un paquet et une version exacts ; elle est justifiée, datée, et
# expire au plus 90 jours après la décision : passé ce délai, le scan échoue jusqu'à ce
# qu'elle soit revue (le job image tourne aussi chaque lundi).
# 16/10/2026 : aucune exception. La base distroless cc-debian13 (e792ab3, fusionnée le
# 15/10) porte libssl3t64 3.5.7-1~deb13u3, correctif de Debian (DSA-6531-1) des quatre
# failles d'OpenSSL du 01/10 (CVE-2026-54873, CVE-2026-72897, CVE-2026-84782,
# CVE-2026-84784). Les copies d'OpenSSL que le scanner ne voit pas restent touchées par
# leur version : 3.5.8 de psycopg-binary 3.3.6 (libpq), et, sur arm64, 1.1.1k FIPS de
# Kerberos ; aucune exception ne peut les couvrir : suivies au journal (16/10/2026).
exceptions: []
