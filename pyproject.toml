[project]
name = "contract-decision-graph"
version = "0.1.0"
description = "Graphe LangGraph qui rend un verdict go / no-go auditable sur des contrats fournisseurs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8.0",
    "fastembed>=0.8.1",
    "langchain-core>=1.6.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mistralai>=2.10.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: exige PostgreSQL (docker compose up -d) ; exclusion volontaire avec -m \"not pg\"",
    "llm: appelle le vrai modèle (payant) ; exclu par défaut, activé par --llm",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
