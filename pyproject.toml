[project]
name = "contract-decision-graph"
version = "0.1.0"
description = "Graphe LangGraph qui rend un verdict go / no-go auditable sur des contrats fournisseurs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8.0",
    "fastembed>=0.8.1",
    "langchain-core>=1.6.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mistralai>=2.10.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdg"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: exige PostgreSQL (docker compose up -d) ; exclusion volontaire avec -m \"not pg\"",
    "llm: appelle le vrai modèle (payant) ; exclu par défaut, activé par --llm",
]

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

# Vérification des types (mypy) : strict sur domain/, ports/ et application/, mode de base
# sur adapters/ et cli.py. `strict` ne se règle que globalement : ses options sont reprises
# une à une pour les modules stricts (liste de `mypy --help`, mypy 2.3.1).
[tool.mypy]
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
# options de `strict` réglables seulement ici : elles valent pour tout le paquet
warn_redundant_casts = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["cdg.domain.*", "cdg.ports.*", "cdg.application.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true

# PyYAML n'a pas d'annotations : yaml.safe_load rend Any de toute façon. Les stubs de
# typeshed (types-PyYAML) seraient une dépendance de plus, non ajoutée sans accord.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Couverture (coverage.py, par pytest-cov) : mesurée en CI par `pytest --cov`, lignes et
# branches du paquet cdg ; pytest-cov lit fail_under ici (pytest_cov/plugin.py, 7.1.0).
[tool.coverage.run]
source = ["cdg"]
branch = true

[tool.coverage.report]
# juste sous la couverture mesurée le 26/09/2026 (96,81 %, lignes et branches, tests pg
# compris) ; le badge du README affiche cette valeur (tests/test_couverture.py)
fail_under = 96
show_missing = true
