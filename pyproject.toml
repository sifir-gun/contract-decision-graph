[project]
name = "contract-decision-graph"
version = "0.1.0"
description = "Graphe LangGraph qui rend un verdict go / no-go auditable sur des contrats fournisseurs."
readme = "README.md"
# code, fiches et contrats synthétiques ; data/corpus/raw/ garde ses licences d'origine
# (data/corpus/SOURCES.md), et HTMX la sienne, 0BSD (adapters/web/static/)
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.6.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mistralai>=2.10.1",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pyjwt[crypto]==2.15.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdg"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: exige PostgreSQL (docker compose up -d) ; exclusion volontaire avec -m \"not pg\"",
    "llm: appelle le vrai modèle (payant) ; exclu par défaut, activé par --llm",
    "image: vérifie l'image Docker construite ; exclu par défaut, activé par --image ÉTIQUETTE",
    "modele: vérifie l'image du modèle d'embedding ; exclu par défaut, activé par --modele ÉTIQUETTE (et --image)",
    "chart: rend le chart Helm (helm requis) ; exclu par défaut, activé par --chart",
    "proxy: vérifie l'image du proxy de sortie ; exclu par défaut, activé par --proxy ÉTIQUETTE (et --image)",
    "oauth2proxy: vérifie l'image d'oauth2-proxy ; exclu par défaut, activé par --oauth2-proxy ÉTIQUETTE",
    "cluster: scénarios sur le cluster k3d (scripts/cluster.py) ; exclu par défaut, activé par --cluster=DOSSIER, en un mot",
    "journal_reel: lit le vrai journal d'audit du poste, en lecture seule ; exclu par défaut et en CI, activé par --journal-reel",
]

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

# Vérification des types (mypy) : strict sur domain/, ports/ et application/, mode de base
# sur adapters/ et cli.py. `strict` ne se règle que globalement : ses options sont reprises
# une à une pour les modules stricts (liste de `mypy --help`, mypy 2.3.1).
[tool.mypy]
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
# options de `strict` réglables seulement ici : elles valent pour tout le paquet
warn_redundant_casts = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["cdg.domain.*", "cdg.ports.*", "cdg.application.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Couverture (coverage.py, par pytest-cov) : mesurée en CI par `pytest --cov`, lignes et
# branches du paquet cdg ; pytest-cov lit fail_under ici (pytest_cov/plugin.py, 7.1.0).
[tool.coverage.run]
source = ["cdg"]
branch = true

[tool.coverage.report]
# juste sous la couverture mesurée le 27/09/2026 (98,71 %, lignes et branches, tests pg
# compris ; 96 % depuis le 26/09) ; le badge du README affiche cette valeur
# (tests/test_couverture.py)
fail_under = 98
show_missing = true
