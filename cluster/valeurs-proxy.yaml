# Profil de test du chart cdg-proxy : le serveur factice de Mistral, dans le cluster, à la
# place de l'API de Mistral. Le scénario « configuration de production » repasse aux
# valeurs par défaut (seulement api.mistral.ai, aucune adresse privée).
domainesAutorises:
  - mistral-factice.cdg-tests.svc.cluster.local
  # fournisseur d'identité de test (PR D1) : découverte et clés publiques, pour oauth2-proxy
  # et l'application
  - dex.cdg.test
plagesAutorisees:
  - 10.43.0.0/16
sortiesInternes:
  - espaceDeNoms: cdg-tests
    selecteur:
      app: mistral-factice
    port: 8080
  # dex.cdg.test : Traefik (PR D1), port de websecure dans le pod
  - espaceDeNoms: traefik
    selecteur:
      app.kubernetes.io/name: traefik
    port: 8443
