# Stockage objet compatible S3 du cluster de test (ADR 005, PR C3 : SeaweedFS, MinIO étant
# archivé) : reçoit les sauvegardes de la base. Test seulement ; en production, un stockage
# S3 géré. Identités S3 : Secret seaweedfs-s3, créé par scripts/cluster.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: cdg-stockage
  labels:
    app: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seaweedfs
          image: ${SEAWEEDFS}
          args:
            - server
            - -dir=/data
            - -master.volumeSizeLimitMB=64
            - -volume.max=16
            - -s3
            - -s3.port=8333
            - -s3.config=/configuration/s3.json
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: configuration
              mountPath: /configuration
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: configuration
          secret:
            secretName: seaweedfs-s3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: cdg-stockage
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
