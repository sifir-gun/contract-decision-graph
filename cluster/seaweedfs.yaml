# Stockage objet compatible S3 du cluster de test (ADR 005, PR C3 : SeaweedFS, MinIO étant
# archivé) : reçoit les sauvegardes de la base et, en profil ci, les événements bruts de
# Langfuse (ADR 008). Test seulement ; en production, un stockage S3 géré. Identités S3 :
# Secret seaweedfs-s3, créé par scripts/cluster.py. Télémétrie coupée (SeaweedFS 4.47 envoie
# par défaut des statistiques à telemetry.seaweedfs.com) ; aucune sortie hors du cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refus-par-defaut
  namespace: cdg-stockage
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entree-s3
  namespace: cdg-stockage
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes: [Ingress]
  ingress:
    # la base et son greffon de sauvegarde, Langfuse
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cdg
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cdg-observabilite
      ports:
        - port: 8333
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sortie-dns
  namespace: cdg-stockage
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: cdg-stockage
  labels:
    app: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seaweedfs
          image: ${SEAWEEDFS}
          args:
            - server
            - -dir=/data
            - -master.volumeSizeLimitMB=64
            - -volume.max=16
            - -s3
            - -s3.port=8333
            - -s3.config=/configuration/s3.json
            - -master.telemetry=false
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: configuration
              mountPath: /configuration
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: configuration
          secret:
            secretName: seaweedfs-s3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: cdg-stockage
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
